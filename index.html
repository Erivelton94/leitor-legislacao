}

/* ---------- caderno: abas Questões / Índice / Gabarito / Estatísticas ---------- */
let sessao = null, cronometro = null;
function telaCaderno(tipo, chave, aba = "questoes", qAlvo = null) {
  sessao = montarSessao(tipo, chave);
  if (!sessao) { $("#conteudo").innerHTML = `<p class="vazio">Caderno não encontrado neste aparelho.</p>`; return; }
  definirTopo({ titulo: sessao.titulo, voltar: sessao.voltar });
  $("#abas").classList.add("oculto");
  const mapa = mapaRespostas();
  const f = filtrosDe(sessao);
  const bancas = [...new Set(sessao.base.map(q => q.banca))].sort();
  const lista = listaFiltrada(sessao, mapa);
  $("#conteudo").innerHTML = `<div class="secao">
    <div class="filtros">
      <div class="segmentado" id="abas-caderno">
        ${[["questoes", "Questões"], ["indice", "Índice"], ["gabarito", "Gabarito"], ["estatisticas", "Estatísticas"]].map(([v, r]) =>
          `<button data-aba-cad="${v}" aria-pressed="${aba === v}">${r}</button>`).join("")}
      </div>
    </div>
    <div class="filtros">
      <select class="campo" id="f-assunto"><option value="">Todos os assuntos (${sessao.base.length})</option>
        ${sessao.assuntos.map(a => `<option value="${esc(a)}" ${f.assunto === a ? "selected" : ""}>${esc(a)} (${sessao.base.filter(q => q.assunto === a).length})</option>`).join("")}</select>
      <select class="campo" id="f-situacao">
        ${[["", "Todas"], ["nao", "Não resolvidas"], ["errada", "Que errei (rodada atual)"], ["certa", "Que acertei (rodada atual)"], ["ja-errei", "Que já errei alguma vez"], ["favoritas", "★ Favoritas"]].map(([v, r]) =>
          `<option value="${v}" ${f.situacao === v ? "selected" : ""}>${r}</option>`).join("")}</select>
      ${bancas.length > 1 ? `<select class="campo" id="f-banca"><option value="">Todas as bancas</option>${bancas.map(b => `<option ${f.banca === b ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>` : ""}
      ${lista.length ? `<button class="botao" id="redefinir-lista">Redefinir esta lista (${lista.length})</button>` : ""}
    </div>
    <div id="area-caderno"></div></div>`;
  const aplicar = () => {
    gravarFiltros(sessao, { assunto: $("#f-assunto").value, situacao: $("#f-situacao").value, banca: $("#f-banca")?.value || "" });
    telaCaderno(tipo, chave, aba);
  };
  $("#f-assunto").onchange = aplicar; $("#f-situacao").onchange = aplicar;
  if ($("#f-banca")) $("#f-banca").onchange = aplicar;
  $$("[data-aba-cad]").forEach(b => b.onclick = () => telaCaderno(tipo, chave, b.dataset.abaCad));
  const br = $("#redefinir-lista");
  if (br) br.onclick = async () => {
    if (!confirm(`As ${lista.length} questões desta lista voltam a ficar sem resposta, para você resolver de novo.\n\nSuas estatísticas continuam com todos os acertos e erros já registrados. Redefinir?`)) return;
    await redefinirQuestoes(lista.map(q => q.id));
    const f2 = filtrosDe(sessao);
    if (["errada", "certa"].includes(f2.situacao)) { f2.situacao = ""; gravarFiltros(sessao, f2); }
    const pos = lerLS("pos-q", {}); delete pos[sessao.chave]; gravarLS("pos-q", pos);
    telaCaderno(tipo, chave, "questoes", lista[0].id);
  };
  sessao.tipo = tipo; sessao.chaveOrig = chave; sessao.lista = lista;
  if (aba === "indice") return abaIndice(mapa);
  if (aba === "gabarito") return abaGabarito(mapa);
  if (aba === "estatisticas") return abaEstatisticas(lista, mapa, true);
  abaQuestao(mapa, qAlvo);
}

function abaIndice(mapa) {
  const l = sessao.lista;
  if (!l.length) { $("#area-caderno").innerHTML = `<p class="vazio">Nenhuma questão com esses filtros.</p>`; return; }
  const icone = { nao: "•", certa: "✓", errada: "✗" };
  let h = "";
  for (const a of sessao.assuntos) {
    const qs = l.filter(q => q.assunto === a);
    if (!qs.length) continue;
    h += `<h3 class="grupo-assunto">${esc(a)} <span class="contagem">(${qs.length})</span></h3><ul class="resultados">`;
    for (const q of qs) {
      const s = situacaoQ(mapa, q.id);
      h += `<li><button data-ir-q="${esc(q.id)}"><span class="res-titulo"><span class="sit sit-${s}">${icone[s]}</span> Questão ${l.indexOf(q) + 1}${ehFavorito(idFavQ(q.id)) ? " ★" : ""} — ${esc(q.banca)} · ${q.ano}</span>
        <span class="res-trecho">${esc(q.enunciado.join(" ").slice(0, 150))}…</span></button></li>`;
    }
    h += "</ul>";
  }
  $("#area-caderno").innerHTML = h;
}

function abaGabarito(mapa) {
  const l = sessao.lista;
  const mostrar = sessionStorage.getItem("mostrar-gabarito") === "1";
  let h = `<div class="acoes" style="margin:4px 0 12px"><button id="alt-gab">${mostrar ? "Esconder o gabarito" : "Mostrar o gabarito"}</button></div>`;
  if (!mostrar) h += `<p class="contagem">O gabarito fica escondido para não atrapalhar quem ainda vai resolver. Suas respostas da rodada atual aparecem em verde (acerto) ou vermelho (erro).</p>`;
  for (const a of sessao.assuntos) {
    const qs = l.filter(q => q.assunto === a);
    if (!qs.length) continue;
    h += `<h3 class="grupo-assunto">${esc(a)}</h3><div class="grade-gabarito">`;
    for (const q of qs) {
      const r = respostaAtual(mapa, q.id);
      const cls = r ? (r.correta ? "certa" : "errada") : "";
      h += `<button class="cel-gab ${cls}" data-ir-q="${esc(q.id)}"><span>${l.indexOf(q) + 1}</span><strong>${mostrar ? esc(q.gabarito) : r ? esc(r.marcada) : "–"}</strong></button>`;
    }
    h += "</div>";
  }
  $("#area-caderno").innerHTML = h;
  $("#alt-gab").onclick = () => { sessionStorage.setItem("mostrar-gabarito", mostrar ? "0" : "1"); abaGabarito(mapa); };
}

/* ---------- resolução de uma questão ---------- */
let riscadas = {};
let inicioQuestao = 0;
function abaQuestao(mapa, qAlvo) {
  const l = sessao.lista;
  if (!l.length) { $("#area-caderno").innerHTML = `<p class="vazio">Nenhuma questão com esses filtros. Mude o assunto ou a situação acima.</p>`; return; }
  const pos = lerLS("pos-q", {});
  let i = qAlvo ? l.findIndex(q => q.id === qAlvo) : l.findIndex(q => q.id === pos[sessao.chave]);
  if (i < 0) i = 0;
  mostrarQuestao(i, mapa);
}
function cabecalhoRodada(l, mapa) {
  const e = estatisticas(l, mapa);
  return `(${e.resolvidas} resolvidas, <span class="txt-ok">${e.certas} acertos</span> e <span class="txt-erro">${e.erradas} erros</span>)`;
}
function letraExibida(q, letra) { return q.tipo === "CE" ? (letra === "C" ? "Certo" : "Errado") : letra; }

function mostrarQuestao(i, mapa = mapaRespostas()) {
  const l = sessao.lista;
  const q = l[i];
  const pos = lerLS("pos-q", {}); pos[sessao.chave] = q.id; gravarLS("pos-q", pos);
  const todas = mapa.get(q.id) || [];
  const atual = respostaAtual(mapa, q.id);
  const temLei = q.vinculo && noAcervo(q.vinculo.lei);
  const fav = ehFavorito(idFavQ(q.id));
  const nota = estado.itens.get(idNotaQ(q.id));
  riscadas[q.id] = riscadas[q.id] || [];
  inicioQuestao = Date.now();
  const historico = todas.length ? `Histórico desta questão: ${todas.filter(r => r.correta).length} acerto(s) e ${todas.filter(r => !r.correta).length} erro(s) em ${todas.length} resposta(s).` : "";
  $("#area-caderno").innerHTML = `<article class="questao" data-q="${esc(q.id)}">
    <div class="q-cab">
      <div><strong>Questão ${i + 1} de ${l.length}</strong> <span class="contagem" id="q-rodada">${cabecalhoRodada(l, mapa)}</span></div>
      <div class="cronometro" title="Tempo de estudo nesta sessão">⏱ <span id="crono-t">00:00</span> <button class="link" id="crono-p">pausar</button></div>
    </div>
    <p class="q-meta">Matéria: ${esc(q.materia)} · Assunto: ${esc(q.assunto)}${q.vinculo ? (temLei
      ? ` · <a href="#/lei/${esc(q.vinculo.lei)}/${encodeURIComponent(q.vinculo.de)}">Ler ${esc(rotuloVinculo(q.vinculo))} no ${esc(nomeLei(q.vinculo.lei))}</a>`
      : ` · <a href="#/catalogo">${esc(rotuloVinculo(q.vinculo))} — adicionar ${esc(nomeLei(q.vinculo.lei))} ao acervo</a>`) : ""}</p>
    <p class="q-prova">${esc(provaQ(q))}</p>
    <div class="q-enunciado">${q.enunciado.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <ul class="alternativas ${q.tipo === "CE" ? "ce" : ""}" role="radiogroup" aria-label="Alternativas">
      ${q.alternativas.map(a => `<li><button class="alt ${riscadas[q.id].includes(a.letra) ? "riscada" : ""}" role="radio" aria-checked="false" data-letra="${esc(a.letra)}">
        <span class="letra">${esc(a.letra)}</span><span class="alt-texto">${esc(a.texto)}</span></button>
        ${q.tipo === "CE" ? "" : `<button class="riscar" data-riscar="${esc(a.letra)}" aria-label="Riscar a alternativa ${esc(a.letra)}" title="Riscar alternativa">✂</button>`}</li>`).join("")}
    </ul>
    <div class="acoes-q"><button class="botao primario" id="btn-responder" disabled>Responder</button></div>
    <div id="resultado-q" aria-live="polite"></div>
    <p class="contagem" id="q-historico">${historico}</p>
    <div class="barra-q">
      <button class="icone-btn" data-nav="-1" aria-label="Questão anterior" ${i === 0 ? "disabled" : ""}>← Anterior</button>
      <button class="icone-btn" data-nav="1" aria-label="Próxima questão" ${i === l.length - 1 ? "disabled" : ""}>Próxima →</button>
      <button class="icone-btn" id="q-aleatoria" aria-label="Questão aleatória">Aleatória</button>
      <button class="icone-btn" id="q-fav" aria-pressed="${fav}">${fav ? "★ Favorita" : "☆ Favoritar"}</button>
      <button class="icone-btn" id="q-nota">${nota && !nota.apagado ? "✎ Meu comentário" : "✎ Comentar"}</button>
    </div>
  </article>`;
  iniciarCronometro();

  // Questão já respondida nesta rodada: fica travada com a sua resposta até você redefinir a lista.
  const exibirResultado = r => {
    $$(".alt").forEach(x => {
      x.disabled = true;
      if (x.dataset.letra === q.gabarito) x.classList.add("certa");
      else if (x.dataset.letra === r.marcada) x.classList.add("errada");
      if (x.dataset.letra === r.marcada) { x.classList.add("marcada"); x.setAttribute("aria-checked", "true"); }
    });
    $$(".riscar").forEach(x => { x.disabled = true; });
    $(".acoes-q").classList.add("oculto");
    $("#resultado-q").innerHTML = (r.correta
      ? `<p class="res-q ok">✓ Você acertou!`
      : `<p class="res-q erro">✗ Você errou. Resposta: <strong>${esc(letraExibida(q, q.gabarito))}</strong>.`) +
      ` <button class="link" id="ver-resolucao">Ver resolução</button></p>
      <p class="contagem">Respondida em ${dataHora(r.em)}. Para resolver de novo, use “Redefinir esta lista”.</p>`;
    $("#ver-resolucao").onclick = () => mostrarResolucao(q);
  };
  if (atual) exibirResultado(atual);

  let marcada = null;
  $$(".alt").forEach(b => b.onclick = () => {
    if (b.disabled) return;
    marcada = b.dataset.letra;
    $$(".alt").forEach(x => { x.classList.toggle("marcada", x === b); x.setAttribute("aria-checked", x === b); });
    $("#btn-responder").disabled = false;
  });
  $$("[data-riscar]").forEach(b => b.onclick = () => {
    const letra = b.dataset.riscar;
    const r = riscadas[q.id];
    riscadas[q.id] = r.includes(letra) ? r.filter(x => x !== letra) : [...r, letra];
    b.previousElementSibling.classList.toggle("riscada");
  });
  $("#btn-responder").onclick = async () => {
    if (!marcada) return;
    $("#btn-responder").disabled = true;
    const tempo = Math.min(1800, Math.round((Date.now() - inicioQuestao) / 1000));
    const r = await salvarItem({ id: uid(), tipo: "resposta", q: q.id, caderno: q.caderno, marcada, correta: marcada === q.gabarito, em: agoraISO(), tempo });
    exibirResultado(r);
    const m2 = mapaRespostas();
    $("#q-rodada").innerHTML = cabecalhoRodada(l, m2);
    const t = m2.get(q.id) || [];
    $("#q-historico").textContent = `Histórico desta questão: ${t.filter(x => x.correta).length} acerto(s) e ${t.filter(x => !x.correta).length} erro(s) em ${t.length} resposta(s).`;
  };
  $$("[data-nav]").forEach(b => b.onclick = () => { mostrarQuestao(i + Number(b.dataset.nav)); window.scrollTo(0, 0); });
  $("#q-aleatoria").onclick = () => {
    const m = mapaRespostas();
    const pendentes = l.map((x, k) => k).filter(k => k !== i && situacaoQ(m, l[k].id) === "nao");
    const pool = pendentes.length ? pendentes : l.map((x, k) => k).filter(k => k !== i);
    if (pool.length) { mostrarQuestao(pool[Math.floor(Math.random() * pool.length)]); window.scrollTo(0, 0); }
  };
  $("#q-fav").onclick = async () => {
    await alternarFavorito(idFavQ(q.id), { alvo: "questao", q: q.id, caderno: q.caderno });
    const f = ehFavorito(idFavQ(q.id));
    $("#q-fav").textContent = f ? "★ Favorita" : "☆ Favoritar";
    $("#q-fav").setAttribute("aria-pressed", f);
  };
  $("#q-nota").onclick = () => mostrarResolucao(q, true);
}

function mostrarResolucao(q, focarNota = false) {
  const nota = estado.itens.get(idNotaQ(q.id));
  const respondida = respostaAtual(mapaRespostas(), q.id);
  abrirPainel(`<h2>${respondida ? "Resolução" : "Meu comentário"} ${botaoFechar}</h2>
    ${respondida ? `<p><strong>Gabarito: ${esc(letraExibida(q, q.gabarito))}</strong></p>` : '<p class="contagem">O gabarito aparece aqui depois que você responder a questão.</p>'}
    ${q.vinculo && noAcervo(q.vinculo.lei) ? `<div class="acoes" style="margin-bottom:12px"><button data-href="#/lei/${esc(q.vinculo.lei)}/${encodeURIComponent(q.vinculo.de)}">Ler ${esc(rotuloVinculo(q.vinculo))} no ${esc(nomeLei(q.vinculo.lei))}</button></div>` : ""}
    <p class="contagem">Seu comentário sobre esta questão (fundamento, pegadinha, artigo cobrado). Fica guardado e entra no backup.</p>
    <textarea class="campo" id="nota-q" placeholder="Ex.: a qualificadora alcança parente consanguíneo só até o 3º grau (art. 121, § 2º, VII).">${esc(nota && !nota.apagado ? nota.nota : "")}</textarea>
    <div class="acoes" style="margin-top:10px"><button class="botao primario" id="salvar-nota-q">Salvar comentário</button></div>`);

/* cronômetro da sessão de estudo (pausável) */
function iniciarCronometro() {
  if (!cronometro || cronometro.sessao !== sessao.chave) cronometro = { sessao: sessao.chave, acumulado: 0, desde: Date.now(), pausado: false };
  const pintar = () => {
    const el = $("#crono-t");
    if (!el) return;
    const s = Math.floor((cronometro.acumulado + (cronometro.pausado ? 0 : Date.now() - cronometro.desde)) / 1000);
    const hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
    el.textContent = (hh ? String(hh).padStart(2, "0") + ":" : "") + String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
    $("#crono-p").textContent = cronometro.pausado ? "continuar" : "pausar";
  };
  clearInterval(cronometro.intervalo);
  cronometro.intervalo = setInterval(pintar, 1000);
  pintar();
  $("#crono-p").onclick = () => {
    if (cronometro.pausado) { cronometro.desde = Date.now(); cronometro.pausado = false; }
    else { cronometro.acumulado += Date.now() - cronometro.desde; cronometro.pausado = true; }
    pintar();
  };
}

/* ---------- estatísticas ----------
   Rodada atual: situação de cada questão desde o último "redefinir".
   Histórico: TODAS as respostas já dadas (nada é apagado ao redefinir). */
function estatisticas(lista, mapa) {
  let resolvidas = 0, certas = 0, erradas = 0, respostas = 0, acertosTotal = 0, errosTotal = 0, tempo = 0;
  const porAssunto = {}, porBanca = {}, porDia = {}, erros = [];
  for (const q of lista) {
    const rs = mapa.get(q.id) || [];
    const pa = porAssunto[q.assunto] = porAssunto[q.assunto] || { total: 0, respostas: 0, acertos: 0, erros: 0 };
    const pb = porBanca[q.banca] = porBanca[q.banca] || { total: 0, respostas: 0, acertos: 0, erros: 0 };
    pa.total++; pb.total++;
    const atual = respostaAtual(mapa, q.id);
    if (atual) { resolvidas++; if (atual.correta) certas++; else erradas++; }
    let nErros = 0;
    for (const r of rs) {
      respostas++; pa.respostas++; pb.respostas++; tempo += r.tempo || 0;
      if (r.correta) { acertosTotal++; pa.acertos++; pb.acertos++; } else { errosTotal++; pa.erros++; pb.erros++; nErros++; }
      const d = new Date(r.em).toLocaleDateString("sv-SE");   // dia no fuso do aparelho
      const pd = porDia[d] = porDia[d] || { certas: 0, erradas: 0 };
      if (r.correta) pd.certas++; else pd.erradas++;
    }
    if (nErros) erros.push({ q, nErros, tentativas: rs.length });
  }
  erros.sort((a, b) => b.nErros - a.nErros || b.tentativas - a.tentativas);
  return { total: lista.length, resolvidas, certas, erradas, respostas, acertosTotal, errosTotal, tempo, porAssunto, porBanca, porDia, erros,
           pctTotal: respostas ? Math.round(100 * acertosTotal / respostas) : 0 };
}
function tabelaDesempenho(obj, ordem) {
  const chaves = ordem ? ordem.filter(k => obj[k]) : Object.keys(obj).sort();
  return `<div class="tabela-desemp">${chaves.map(k => {
    const v = obj[k];
    const pct = v.respostas ? Math.round(100 * v.acertos / v.respostas) : null;
    return `<div class="linha-desemp"><span class="nome-desemp">${esc(k)} <span class="contagem">(${v.total} questões)</span></span>
      <span class="barra-desemp" aria-hidden="true"><span class="b-ok" style="width:${v.respostas ? 100 * v.acertos / v.respostas : 0}%"></span><span class="b-erro" style="width:${v.respostas ? 100 * v.erros / v.respostas : 0}%"></span></span>
      <span class="num-desemp">${v.respostas ? `${v.acertos} ✓ · ${v.erros} ✗ · ${pct}%` : "sem respostas"}</span></div>`;
  }).join("")}</div>`;
}
function graficoDias(porDia) {
  const dias = [];
  for (let k = 29; k >= 0; k--) dias.push(new Date(Date.now() - k * 864e5).toLocaleDateString("sv-SE"));
  const max = Math.max(1, ...dias.map(d => (porDia[d]?.certas || 0) + (porDia[d]?.erradas || 0)));
  const L = 600, A = 140, w = L / 30;
  let barras = "";
  dias.forEach((d, k) => {
    const c = porDia[d]?.certas || 0, e = porDia[d]?.erradas || 0;
    const hc = A * c / max, he = A * e / max;
    barras += `<rect x="${k * w + 2}" y="${A - hc}" width="${w - 4}" height="${hc}" fill="var(--ok)"><title>${dataCurta(d)}: ${c} acertos</title></rect>`;
    barras += `<rect x="${k * w + 2}" y="${A - hc - he}" width="${w - 4}" height="${he}" fill="var(--alt)"><title>${dataCurta(d)}: ${e} erros</title></rect>`;
  });
  return `<svg class="grafico-dias" viewBox="0 0 ${L} ${A + 18}" role="img" aria-label="Respostas por dia nos últimos 30 dias">
    <line x1="0" y1="${A}" x2="${L}" y2="${A}" stroke="var(--fio)"/>${barras}
    <text x="0" y="${A + 14}" font-size="11" fill="var(--tinta-2)">${dataCurta(dias[0])}</text>
    <text x="${L}" y="${A + 14}" font-size="11" fill="var(--tinta-2)" text-anchor="end">hoje</text></svg>`;
}
function formatarTempo(s) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h} h ${m} min` : `${m} min`; }

async function tamanhoCache(filtro) {
  const cache = await caches.open(CACHE_DADOS);
  let bytes = 0, qtd = 0;
  for (const req of await cache.keys()) {
    if (!filtro(req.url)) continue;
    const r = await cache.match(req);
    bytes += (await r.clone().blob()).size; qtd++;
  }
  return { bytes, qtd };
}

/* ---------- seleção de trecho → barra de grifo ---------- */
let selecaoAtual = null;
function esconderBarra() { $("#barra-selecao").classList.add("oculto"); }
function lerSelecao() {
  const sel = window.getSelection();
  if (caneta.ativa || !leiAberta || !sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  const noIni = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
  const noFim = r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement;
  const div = noIni?.closest(".artigo");
  if (!div || div !== noFim?.closest(".artigo")) return { erro: "Selecione um trecho dentro de um único artigo." };
  let ini = posicaoNoArtigo(div, r.startContainer, r.startOffset);
  let fim = posicaoNoArtigo(div, r.endContainer, r.endOffset);
  const texto = textoDoArtigo(div);
  while (ini < fim && /\s/.test(texto[ini])) ini++;
  while (fim > ini && /\s/.test(texto[fim - 1])) fim--;
  if (fim <= ini) return null;
  return { lei: leiAberta, art: div.dataset.art, ini, fim, texto: texto.slice(ini, fim), textoArtigo: texto };
}
let tempoSel = null;
document.addEventListener("selectionchange", () => {
  clearTimeout(tempoSel);
  tempoSel = setTimeout(() => {
    const s = lerSelecao();
    if (s && !s.erro) { selecaoAtual = s; $("#barra-selecao").classList.remove("oculto"); }
    else if (!window.getSelection()?.toString()) setTimeout(() => { if (!window.getSelection()?.toString()) esconderBarra(); }, 300);
  }, 180);
});
function novaAncora(s) {
  const lei = estado.leis[s.lei];
  return {
    lei: s.lei, art: s.art, versao: lei.versao, hashArt: lei.artigos[s.art].hash, textoOriginal: lei.artigos[s.art].texto,
    ini: s.ini, fim: s.fim, texto: s.texto,
    prefixo: s.textoArtigo.slice(Math.max(0, s.ini - 40), s.ini), sufixo: s.textoArtigo.slice(s.fim, s.fim + 40),
  };
}
async function acaoSelecao(acao, cor) {
  const s = selecaoAtual;
  if (!s) return;
  window.getSelection()?.removeAllRanges();
  esconderBarra();
  if (acao === "grifar") {
    await salvarItem({ id: uid(), tipo: "grifo", cor, ...novaAncora(s) });
    repintarArtigo(s.lei, s.art);
  } else if (acao === "anotar") {
    editorAnotacao({ ...novaAncora(s), criarGrifo: true });   // o grifo só é criado se a anotação for salva
  } else if (acao === "favoritar") {
    await salvarItem({ id: uid(), tipo: "favorito", alvo: "trecho", ...novaAncora(s) });
    abrirPainel(`<h2>Trecho favoritado ${botaoFechar}</h2><p class="citacao" style="font-family:var(--serif)">“${esc(s.texto)}”</p><p class="contagem">Veja em Meus estudos → Favoritos.</p>`);
  } else if (acao === "copiar") {
    try { await navigator.clipboard.writeText(s.texto); } catch {}
  }
  selecaoAtual = null;
}
$("#barra-selecao").addEventListener("pointerdown", e => {
  const b = e.target.closest("button");
  if (!b) return;
  e.preventDefault();          // mantém a seleção enquanto o botão é tocado

/* Redimensiona para no máximo 1600 px e salva em JPEG ~78% (fotos de 4 MB viram ~300 KB). */
async function comprimirImagem(arquivo) {
  const url = URL.createObjectURL(arquivo);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const lado = Math.max(img.naturalWidth, img.naturalHeight);
    const f = Math.min(1, 1600 / lado);
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * f);
    c.height = Math.round(img.naturalHeight * f);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.78));
    if (!blob) throw new Error("falha");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

/* =====================================================================
   BACKUP (exportar / importar com mesclagem pela data)
   ===================================================================== */
function blobParaBase64(blob) {
  return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
}
function base64ParaBlob(b64, tipo) {
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: tipo || "image/jpeg" });
}
async function exportarBackup() {
  const btn = $("#btn-exportar");
  if (btn) btn.textContent = "Preparando…";
  const imgs = await bdTodos("imagens");
  const pacote = {
    app: "leitor-legislacao", formato: 1, exportadoEm: agoraISO(),
    itens: [...estado.itens.values()],
    resumos: await bdTodos("resumos"),
    resumosConteudo: await bdTodos("resumos_conteudo"),
    imagens: await Promise.all(imgs.map(async i => ({ id: i.id, tipoMime: i.tipoMime, atualizadoEm: i.atualizadoEm, dados: await blobParaBase64(i.blob) }))),
    ajustes, posicao: lerLS("posicao", {}),
  };
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  const nome = `backup-legislacao-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
  const arquivo = new File([JSON.stringify(pacote)], nome, { type: "application/json" });
  let ok = false;
  try {
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) { await navigator.share({ files: [arquivo], title: nome }); ok = true; }
  } catch (e) { if (e.name === "AbortError") { if (btn) btn.textContent = "Exportar backup"; return; } }
  if (!ok) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(arquivo); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    ok = true;
  }
  gravarLS("ultimo-backup", pacote.exportadoEm);
  if (location.hash.startsWith("#/ajustes")) telaAjustes();
}

$("#entrada-backup").onchange = async e => {
  const arq = e.target.files[0];
  e.target.value = "";
  if (!arq) return;
  let p;
  try { p = JSON.parse(await arq.text()); } catch { alert("Este arquivo não é um backup válido do app."); return; }
  if (p.app !== "leitor-legislacao" || !Array.isArray(p.itens)) { alert("Este arquivo não é um backup do Leitor de Legislação."); return; }
  const maisRecenteLocal = [...estado.itens.values()].reduce((m, i) => (i.atualizadoEm > m ? i.atualizadoEm : m), "");
  if (maisRecenteLocal && p.exportadoEm < maisRecenteLocal &&
      !confirm(`Este backup é de ${dataHora(p.exportadoEm)}, e há alterações mais recentes neste aparelho (${dataHora(maisRecenteLocal)}).\n\nA importação não apaga nada: em cada item fica a versão mais recente. Continuar?`)) return;
  let novos = 0, atualizados = 0, mantidos = 0, imgsNovas = 0;
  for (const it of p.itens) {
    const loc = estado.itens.get(it.id);
    versaoItens++;
    if (!loc) { await bdGravar("itens", it); estado.itens.set(it.id, it); novos++; }
    else if (it.atualizadoEm > loc.atualizadoEm) { await bdGravar("itens", it); estado.itens.set(it.id, it); atualizados++; }
    else mantidos++;
  }
  // resumos: fica a versão mais recente de cada um (o conteúdo acompanha)
  const conteudos = new Map((p.resumosConteudo || []).map(c => [c.id, c]));
  for (const r of p.resumos || []) {
    const loc = await bdLer("resumos", r.id);
    if (loc && loc.atualizadoEm >= r.atualizadoEm) { mantidos++; continue; }
    await bdGravar("resumos", r);
    if (r.apagado) await bdApagar("resumos_conteudo", r.id);
    else if (conteudos.has(r.id)) await bdGravar("resumos_conteudo", conteudos.get(r.id));
    loc ? atualizados++ : novos++;
  }
  resumos.lista = null; resumos.textos = null;
  const usadas = new Set(itens("anotacao").flatMap(n => n.imagens || []));
  for (const c of await bdTodos("resumos_conteudo")) for (const id of imagensDoHtml(c.html || "")) usadas.add(id);   // imagens dos resumos também ficam
  for (const im of p.imagens || []) {
    if (!usadas.has(im.id) || await bdLer("imagens", im.id)) continue;
    await bdGravar("imagens", { id: im.id, blob: base64ParaBlob(im.dados, im.tipoMime), tipoMime: im.tipoMime, atualizadoEm: im.atualizadoEm });
    imgsNovas++;
  }
  // imagens que nenhuma anotação usa mais são removidas
  for (const im of await bdTodos("imagens")) if (!usadas.has(im.id)) await bdApagar("imagens", im.id);
  gravarLS("ultima-mudanca", agoraISO());
  abrirPainel(`<h2>Backup importado ${botaoFechar}</h2>
    <p>Itens novos: ${novos}<br>Itens atualizados com a versão do backup: ${atualizados}<br>Itens mantidos (versão do aparelho era igual ou mais nova): ${mantidos}<br>Imagens adicionadas: ${imgsNovas}</p>
    <p class="contagem">Backup de ${dataHora(p.exportadoEm)}.</p>`);
  if (location.hash.startsWith("#/ajustes")) telaAjustes();
};

/* =====================================================================
   NAVEGAÇÃO: o botão Voltar leva para a tela de onde você veio
   (e não para um lugar fixo). Pular de artigo dentro da mesma lei não
   conta como "tela nova".
   ===================================================================== */
let pilhaNav = (() => { try { return JSON.parse(sessionStorage.getItem("pilha-nav")) || []; } catch { return []; } })();
let voltandoNav = false, raizNav = false, ultimaRolagem = 0;
const ROTAS_RAIZ = ["acervo", "questoes", "resumos", "pesquisar", "estudos", "ajustes"];
window.addEventListener("scroll", () => { ultimaRolagem = window.scrollY; }, { passive: true });
function baseRota(h) {
  const p = h.replace(/^#\/?/, "").split("/");
  if (p[0] === "lei" || p[0] === "caderno") return p[0] + "/" + p[1];
  return h.replace(/^#\/?/, "") || "acervo";
}
function registrarNavegacao() {
  const h = location.hash || "#/acervo";
  const b = baseRota(h);
  const topo = pilhaNav[pilhaNav.length - 1];
  voltandoNav = false;
  if (raizNav) { pilhaNav = [{ h, b, y: 0 }]; raizNav = false; }
  else if (topo && topo.b === b) topo.h = h;                                   // mesma tela (outro artigo da mesma lei)
  else if (pilhaNav.length > 1 && pilhaNav[pilhaNav.length - 2].b === b) {     // voltou para a tela anterior
    pilhaNav.pop(); pilhaNav[pilhaNav.length - 1].h = h; voltandoNav = true;
  } else {
    if (topo) topo.y = ultimaRolagem;
    pilhaNav.push({ h, b, y: 0 });
  }
  if (pilhaNav.length > 40) pilhaNav.splice(0, pilhaNav.length - 40);
  sessionStorage.setItem("pilha-nav", JSON.stringify(pilhaNav));
}
function voltar() {
  if (pilhaNav.length > 1) { location.hash = pilhaNav[pilhaNav.length - 2].h; return; }
  const destino = $("#btn-voltar").dataset.destino || "#/acervo";
  raizNav = ROTAS_RAIZ.includes(baseRota(destino));
  location.hash = destino;
}
function paiDaLei(id) { const p = pastasDe("leis").find(x => (x.leis || []).includes(id)); return p ? `#/acervo/pasta/${p.id}` : "#/acervo"; }
function paiDoCaderno(id) { const p = pastasDe("questoes").find(x => (x.cadernos || []).includes(id)); return p ? `#/questoes/pasta/${p.id}` : "#/questoes"; }

/* =====================================================================
   CANETA: ferramentas Caneta, Marca-texto, Ícones e Borracha.
   - Pencil desenha; dedo rola. Com "Usar o dedo": 1 dedo desenha, 2 rolam.
   - Borracha livre (apaga só onde passa) ou de traço inteiro.
   - Desfazer e Refazer valem para tudo (traços e ícones).

const NS_SVG = "http://www.w3.org/2000/svg";
const CORES_CANETA = [["#D32F2F", "Vermelho"], ["#1E5BD8", "Azul"], ["#15803D", "Verde"], ["#1F2A36", "Preto"], ["#E0B000", "Amarelo"]];
const ESP_CANETA = [[1.5, "Fina"], [2.5, "Média"], [4, "Grossa"]];
const ESP_MARCA = [[10, "Fino"], [15, "Médio"], [22, "Grosso"]];

/* ---------- borracha (livre: apaga só onde passa; ou traço inteiro) ---------- */
function distPontoSegmento(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;

function densificar(p, passo = 1) {
  const out = [p[0], p[1]];
  for (let i = 2; i < p.length; i += 2) {
    const x0 = out[out.length - 2], y0 = out[out.length - 1], x1 = p[i], y1 = p[i + 1];
    const n = Math.floor(Math.hypot(x1 - x0, y1 - y0) / passo);
    for (let k = 1; k <= n; k++) out.push(+(x0 + (x1 - x0) * k / (n + 1)).toFixed(1), +(y0 + (y1 - y0) * k / (n + 1)).toFixed(1));
    out.push(x1, y1);

  return out;
}
const densos = new WeakMap();                       // pontos refinados de cada traço (calculados uma vez)
const caixas = new WeakMap();                       // retângulo de cada traço: descarta rápido o que está longe
function tracoPerto(t, ax, ay, x, y, alc) {

    c = [Infinity, Infinity, -Infinity, -Infinity];

function passarBorracha(a, x, y) {
  const [ax, ay] = a.ultimo;

  let mudou = false;

    // a borracha precisa encostar no traço desenhado (considera a espessura do traço)
    const alcance = caneta.raio + larguraTraco(t) / 2;
    if (!tracoPerto(t, ax, ay, x, y, alcance)) { novos.push(t); continue; }       // longe: nem calcula
    const pts = densos.get(t) || densos.set(t, densificar(t.pts)).get(t);
    const dentro = new Uint8Array(pts.length / 2);
    let tocou = false;
    for (let i = 0, k = 0; i < pts.length; i += 2, k++) if (distPontoSegmento(pts[i], pts[i + 1], ax, ay, x, y) <= alcance) { dentro[k] = 1; tocou = true; }

    mudou = true;
    svg.querySelector(`path[data-traco="${t.id}"]`)?.remove();       // atualiza só o traço cortado, não o desenho todo
    if (caneta.modoBorracha === "traco") continue;
    let run = [];
    const fechar = () => {
      if (run.length >= 4) {
        const pedaco = { ...t, id: uid().slice(0, 8), pts: run };
        densos.set(pedaco, run);                                      // o pedaço já está refinado
        novos.push(pedaco);
        svg.appendChild(elTraco({ ...pedaco, pts: enxugarPontos(run) }));
      }
      run = [];

    for (let k = 0; k < dentro.length; k++) { if (dentro[k]) fechar(); else run.push(pts[2 * k], pts[2 * k + 1]); }

    const fica = distPontoSegmento(c.x, c.y, ax, ay, x, y) > caneta.raio + c.tam * 0.4;

function iniciarBorracha(e) {

  const candidatos = [...marcasDaLei(leiAberta).entries()].filter(([, m]) => m.tintas.length)

  }

    if (!naAreaDaLei(e)) return;

  const div = artigoNoPonto(e);
  if (!div) return;

    const antes = fotografar(item);

    if (!c) { c = { id: uid().slice(0, 8), icone: caneta.icone, tam: caneta.tamIcone, x: p[0], y: p[1] }; item.carimbos.push(c); }

/* Segurar o Pencil parado no fim do traço por meio segundo: o traço vira uma linha reta.

function linhaReta(x0, y0, x1, y1) {
  const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;

function endireitar(tr) {

    }
    const grifos = [...g.grifos.values()];
    for (const gr of grifos) { await apagarItem(gr.id); repintarArtigo(gr.lei, gr.art); }

    return;
  }
  const ar = caneta.arrastando;
  if (ar && ar.pointerId === e.pointerId) {
    caneta.arrastando = null;
    if (mudouFoto(ar.antes, fotografar(ar.item))) { await salvarItem(ar.item); registrarAcao(ar.item, ar.antes); }
    return;

/* =====================================================================
   MEUS RESUMOS — caderno digital
   - Lista mostra só título, matéria e prévia (o conteúdo só é lido ao abrir).
   - Imagens ficam no mesmo armazenamento das anotações, comprimidas, e só
     carregam quando aparecem na tela.
   - Leitores de Word e PDF só são baixados quando você importa um arquivo.

const resumos = { lista: null, textos: null };
async function carregarResumos() {
  if (resumos.lista) return;

  for (const r of await bdTodos("resumos")) resumos.lista.set(r.id, r);
}
const resumosAtivos = () => [...resumos.lista.values()].filter(r => !r.apagado);
async function salvarMeta(r, tocar = true) {
  if (tocar) r.atualizadoEm = agoraISO();
  if (!r.criadoEm) r.criadoEm = r.atualizadoEm;
  await bdGravar("resumos", r);
  resumos.lista.set(r.id, r);
  if (tocar) gravarLS("ultima-mudanca", r.atualizadoEm);
}
async function lerConteudo(id) { return (await bdLer("resumos_conteudo", id))?.html || ""; }
function textoPlanoDe(html) {
  const d = document.createElement("template");
  d.innerHTML = html;
  return d.content.textContent.replace(/\s+/g, " ").trim();
}
async function gravarConteudo(id, html) {
  const texto = textoPlanoDe(html);
  await bdGravar("resumos_conteudo", { id, html, texto });
  if (resumos.textos) resumos.textos.set(id, semAcento(texto));
  return texto;
}
const imagensDoHtml = html => [...html.matchAll(/data-img="([^"]+)"/g)].map(m => m[1]);
async function excluirResumo(id) {
  const html = await lerConteudo(id);
  for (const img of imagensDoHtml(html)) await bdApagar("imagens", img);
  await bdApagar("resumos_conteudo", id);
  const r = resumos.lista.get(id);
  await salvarMeta({ id, apagado: true, titulo: r?.titulo || "" });     // "apagado" evita ressuscitar no backup
}
function materiasResumo() {
  const s = new Set(resumosAtivos().map(r => r.materia).filter(Boolean));
  for (const m of itens("materia")) s.add(m.nome);
  return [...s].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/* ---------- limpeza do HTML colado ou importado (só o que o editor entende) ---------- */
const TAGS_RESUMO = new Set(["P", "H1", "H2", "H3", "H4", "STRONG", "EM", "U", "S", "UL", "OL", "LI", "BLOCKQUOTE", "HR", "BR",
  "SPAN", "MARK", "IMG", "TABLE", "THEAD", "TBODY", "TR", "TD", "TH", "A", "SUB", "SUP"]);
const TROCA_TAG = { B: "STRONG", I: "EM", DIV: "P", H5: "H4", H6: "H4", STRIKE: "S", DEL: "S", INS: "U", FONT: "SPAN" };
function limparHtml(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const visitar = no => {
    for (const el of [...no.children]) {
      visitar(el);
      if (["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "META", "LINK", "TITLE", "NOSCRIPT", "SVG", "CANVAS", "VIDEO", "AUDIO"].includes(el.tagName)) { el.remove(); continue; }
      let alvo = el;
      const nova = TROCA_TAG[el.tagName];
      if (nova) { alvo = document.createElement(nova); alvo.append(...el.childNodes); el.replaceWith(alvo); }
      if (!TAGS_RESUMO.has(alvo.tagName)) { alvo.replaceWith(...alvo.childNodes); continue; }
      const estilo = alvo.style;
      const manter = {};
      if (estilo) {
        if (estilo.color && alvo.tagName === "SPAN") manter.color = estilo.color;
        if (estilo.backgroundColor && ["SPAN", "MARK"].includes(alvo.tagName)) manter["background-color"] = estilo.backgroundColor;
        if (estilo.textAlign && /^(P|H\d|LI|BLOCKQUOTE)$/.test(alvo.tagName)) manter["text-align"] = estilo.textAlign;
        if (alvo.tagName === "IMG" && /%$/.test(estilo.width)) manter.width = estilo.width;
      }
      const href = alvo.tagName === "A" ? alvo.getAttribute("href") : null;
      const img = alvo.dataset?.img, src = alvo.tagName === "IMG" ? alvo.getAttribute("src") : null;
      const classe = alvo.tagName === "BLOCKQUOTE" && alvo.classList.contains("obs") ? "obs" : (alvo.tagName === "IMG" && alvo.classList.contains("img-esq") ? "img-esq" : "");
      for (const a of [...alvo.attributes]) alvo.removeAttribute(a.name);
      const css = Object.entries(manter).map(([k, v]) => `${k}:${v}`).join(";");
      if (css) alvo.setAttribute("style", css);
      if (href && /^(https?:|#\/)/.test(href)) { alvo.setAttribute("href", href); if (/^https?:/.test(href)) { alvo.setAttribute("target", "_blank"); alvo.setAttribute("rel", "noopener"); } }
      if (img) alvo.setAttribute("data-img", img);
      else if (src) alvo.setAttribute("data-src-colado", src);             // convertido depois em imagem guardada
      if (classe) alvo.className = classe;
      if (alvo.tagName === "SPAN" && !alvo.getAttribute("style")) alvo.replaceWith(...alvo.childNodes);
    }
  };
  visitar(tpl.content);
  // parágrafos vazios em sequência viram no máximo um
  let h = tpl.innerHTML.replace(/(<p>(\s|&nbsp;|<br>)*<\/p>){2,}/g, "<p><br></p>").replace(/^(<p>(\s|&nbsp;|<br>)*<\/p>)+/, "");
  return h;
}
/* imagens coladas/importadas: comprimidas e guardadas; no HTML fica só a referência */
async function guardarImagem(blob) {
  let comp = blob.type === "image/gif" ? blob : await comprimirImagem(blob);
  if (comp.size >= blob.size && /^image\/(jpeg|png|webp)$/.test(blob.type) && blob.size < 400000) comp = blob;   // já era leve: fica o original
  const id = uid();
  await bdGravar("imagens", { id, blob: comp, tipoMime: comp.type, atualizadoEm: agoraISO(), dono: "resumo" });
  return id;
}
async function internalizarImagens(raiz) {
  let perdidas = 0;
  for (const img of $$("img[data-src-colado]", raiz)) {
    const src = img.getAttribute("data-src-colado");
    try {
      const r = await fetch(src);
      if (!r.ok) throw new Error();
      const id = await guardarImagem(await r.blob());
      img.removeAttribute("data-src-colado");
      img.setAttribute("data-img", id);
    } catch { img.remove(); perdidas++; }
  }
  return perdidas;
}
/* mostra as imagens só quando chegam perto da tela */
const urlsImagens = new Map();
let observadorImg = null;
function ativarImagensResumo(raiz) {
  if (observadorImg) observadorImg.disconnect();
  observadorImg = new IntersectionObserver(async entradas => {
    for (const e of entradas) {
      if (!e.isIntersecting) continue;
      observadorImg.unobserve(e.target);
      const id = e.target.dataset.img;
      if (!urlsImagens.has(id)) { const r = await bdLer("imagens", id); if (r) urlsImagens.set(id, URL.createObjectURL(r.blob)); }
      if (urlsImagens.has(id)) e.target.src = urlsImagens.get(id);
      else e.target.alt = "Imagem não encontrada neste aparelho";
    }
  }, { rootMargin: "600px 0px" });
  $$("img[data-img]", raiz).forEach(i => { if (!i.getAttribute("src")) observadorImg.observe(i); });
}

function tituloDoArquivo(nome) {
  return nome.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").replace(/^\d+\s+/, "").trim();
}
async function importarArquivo(arq, materia, aoProgresso) {
  const ext = (arq.name.split(".").pop() || "").toLowerCase();
  let html = "", detalhes = "";
  if (ext === "docx") {
    await carregarScript("libs/mammoth.browser.min.js");
    const buf = await arq.arrayBuffer();
    // estilos próprios do seu Word (ex.: "Título Geral", "Sub 1") viram títulos
    const previa = await mammoth.convertToHtml({ arrayBuffer: buf });
    const estilos = [...new Set(previa.messages.map(m => (m.message.match(/paragraph style: '([^']+)'/) || [])[1]).filter(Boolean))];
    const mapa = ["u => u", "strike => s"];
    for (const n of estilos) {
      if (/t[ií]tulo|title|heading|cabe[çc]alho/i.test(n) && !/sub/i.test(n)) mapa.push(`p[style-name='${n}'] => h2:fresh`);
      else if (/sub\s*1|subt[ií]tulo/i.test(n)) mapa.push(`p[style-name='${n}'] => h3:fresh`);
      else if (/sub\s*[2-9]/i.test(n)) mapa.push(`p[style-name='${n}'] => h4:fresh`);
    }
    let nImg = 0;
    const r = await mammoth.convertToHtml({ arrayBuffer: buf }, {
      styleMap: mapa,
      convertImage: mammoth.images.imgElement(async img => {
        const bytes = await img.read();
        const id = await guardarImagem(new Blob([bytes], { type: img.contentType }));
        nImg++;
        return { src: "", "data-img": id };
      }),
    });
    html = r.value.replace(/<img src=""/g, "<img");
    detalhes = `Word · ${nImg} imagem(ns) comprimida(s)`;
  } else if (ext === "pdf") {
    await carregarScript("libs/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "libs/pdf.worker.min.js";
    const r = await pdfParaHtml(window.pdfjsLib, new Uint8Array(await arq.arrayBuffer()), aoProgresso);
    html = r.html;
    detalhes = `PDF · ${r.repetidas ? r.repetidas + " página(s) repetida(s) ignorada(s) · " : ""}${r.removidas} linha(s) de cabeçalho/rodapé removida(s)`;
    if (!html) throw new Error("Este PDF não tem texto selecionável (parece ser uma imagem escaneada).");
  } else if (["txt", "md", "markdown"].includes(ext)) {
    html = markdownSimples(await arq.text());
    detalhes = ext === "txt" ? "Texto" : "Markdown";
  } else throw new Error("Formato não suportado. Use Word (.docx), PDF, .txt ou .md.");
  html = limparHtml(html);
  // o primeiro título curto do arquivo vira o título do resumo (senão, o nome do arquivo)
  const tpl = document.createElement("template"); tpl.innerHTML = html;
  const primeiro = tpl.content.querySelector("h1,h2,h3");
  const titulo = primeiro && primeiro.textContent.trim().length < 90 ? primeiro.textContent.trim() : tituloDoArquivo(arq.name);
  const r = { id: uid(), titulo, materia, assunto: "", favorito: false, arquivado: false, origem: arq.name };
  const texto = await gravarConteudo(r.id, html);
  r.previa = texto.slice(0, 220);
  await salvarMeta(r);
  return { id: r.id, titulo, detalhes: `${detalhes} · ${Math.round(texto.length / 1000)} mil caracteres` };
}
function markdownSimples(t) {
  const esc2 = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  let html = "", lista = null;
  for (const linha of t.replace(/\r/g, "").split("\n")) {
    const l = linha.trim();
    const m = l.match(/^(#{1,4})\s+(.*)$/), li = l.match(/^[-*•]\s+(.*)$/), ln = l.match(/^\d+[.)]\s+(.*)$/);
    const tipo = li ? "ul" : ln ? "ol" : null;
    if (lista && lista !== tipo) { html += `</${lista}>`; lista = null; }
    if (m) html += `<h${Math.min(4, m[1].length + 1)}>${esc2(m[2])}</h${Math.min(4, m[1].length + 1)}>`;
    else if (tipo) { if (!lista) { html += `<${tipo}>`; lista = tipo; } html += `<li>${esc2((li || ln)[1])}</li>`; }
    else if (/^(-{3,}|_{3,})$/.test(l)) html += "<hr>";
    else if (/^>\s?/.test(l)) html += `<blockquote>${esc2(l.replace(/^>\s?/, ""))}</blockquote>`;
    else if (l) html += `<p>${esc2(l)}</p>`;
  }
  if (lista) html += `</${lista}>`;
  return html;
}

/* ---------- leitor de PDF (texto, títulos, listas, negrito/itálico) ---------- */
/* Converte um PDF em HTML de resumo: junta letras em palavras, linhas em parágrafos,
   reconhece títulos, listas, negrito/itálico e caixas recuadas; remove cabeçalhos e rodapés
   repetidos e páginas duplicadas. */
async function pdfParaHtml(pdfjsLib, dados, aoProgresso) {
  const doc = await pdfjsLib.getDocument({ data: dados, disableFontFace: true, isEvalSupported: false }).promise;
  const paginas = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const pg = await doc.getPage(n);
    const vp = pg.getViewport({ scale: 1 });
    await pg.getOperatorList();                 // carrega as fontes (para saber o que é negrito/itálico)
    const tc = await pg.getTextContent();
    const fonte = nome => { try { return pg.commonObjs.get(nome).name || ""; } catch { return ""; } };
    const itens = [];
    for (const it of tc.items) {
      if (!it.str) continue;
      const f = fonte(it.fontName);
      itens.push({ x: it.transform[4], y: vp.height - it.transform[5], w: it.width, h: it.height || Math.abs(it.transform[3]), s: it.str,
                   b: /bold|black|heavy|semibold/i.test(f),
                   // itálico: fonte itálica ou letra "inclinada" (muitos PDFs gerados por navegador fazem assim)
                   i: /italic|oblique/i.test(f) || Math.abs(it.transform[2]) > Math.abs(it.transform[0]) * 0.08 });
    }
    paginas.push({ n, alt: vp.height, larg: vp.width, linhas: agruparLinhas(itens) });
    pg.cleanup();
    if (aoProgresso) aoProgresso(n, doc.numPages);
  }
  await doc.destroy();
  return montarHtml(paginas);
}
function agruparLinhas(itens) {
  itens.sort((a, b) => a.y - b.y || a.x - b.x);
  const linhas = [];
  for (const it of itens) {
    let l = linhas.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.35));
    if (!l) { l = { y: it.y, itens: [] }; linhas.push(l); }
    l.itens.push(it);
  }
  for (const l of linhas) {
    l.itens.sort((a, b) => a.x - b.x);
    const runs = []; let fim = null; let texto = "";
    for (const it of l.itens) {
      let s = it.s;
      if (fim !== null && it.x - fim > it.h * 0.14 && !/\s$/.test(texto) && !/^\s/.test(s)) s = " " + s;
      const u = runs[runs.length - 1];
      if (u && u.b === it.b && u.i === it.i) u.s += s; else runs.push({ s, b: it.b, i: it.i });
      texto += s; fim = it.x + it.w;
    }
    l.runs = runs; l.texto = texto.replace(/\s+/g, " ").trim();
    l.x = l.itens[0].x; l.fim = fim; l.h = Math.max(...l.itens.map(i => i.h));
    l.negrito = l.itens.filter(i => i.s.trim()).every(i => i.b);
    l.italico = l.itens.filter(i => i.s.trim()).every(i => i.i);
  }
  return linhas.filter(l => l.texto).sort((a, b) => a.y - b.y);
}
function montarHtml(paginas) {
  // 1) páginas repetidas (mesmo texto) saem
  // (página quase igual a uma anterior, por exemplo a mesma página impressa de novo com um rabisco, também conta)
  const unicas = []; let repetidas = 0;
  for (const p of paginas) {
    const linhas = new Set(p.linhas.filter(l => l.texto.length > 3).map(l => l.texto));
    const igual = unicas.some(u => { let comum = 0; for (const t of linhas) if (u.conj.has(t)) comum++; return linhas.size && comum / Math.max(linhas.size, u.conj.size) > 0.9; });
    if (igual) { repetidas++; continue; }
    p.conj = linhas; unicas.push(p);
  }
  // 2) cabeçalhos e rodapés: linhas no topo/rodapé que se repetem em mais de uma página, contadores e endereços
  // números só são ignorados em linhas com cara de rodapé (endereço, data/hora, "3/10"); o resto compara o texto exato
  const chave = t => (/https?:|\d+\s*\/\s*\d+|\d{1,2}:\d{2}/.test(t) ? t.replace(/\d+/g, "#") : t).toLowerCase();
  const cont = new Map(), naBorda = new Set(), paginasDe = new Map();
  for (const p of unicas) for (const l of p.linhas) {
    const k = chave(l.texto);
    if (!paginasDe.has(k)) paginasDe.set(k, new Set());
    paginasDe.get(k).add(p.n);
    if (l.y < 120 || l.y > p.alt - 60) { cont.set(k, (cont.get(k) || 0) + 1); naBorda.add(k); }
  }
  let removidas = 0;
  for (const p of unicas) p.linhas = p.linhas.filter(l => {
    const k = chave(l.texto);
    const borda = l.y < 120 || l.y > p.alt - 60;
    // aviso que aparece no topo de uma página e no fim do documento (ex.: marca d'água do material) também sai
    const aviso = naBorda.has(k) && paginasDe.get(k).size > 1 && l.texto.length > 45;
    const tirar = aviso || (borda && (cont.get(k) > 1 || /^https?:\/\//.test(l.texto) || /^\d+\s*\/\s*\d+$/.test(l.texto)));
    if (tirar) removidas++;
    return !tirar;
  });
  const todas = unicas.flatMap(p => p.linhas.map(l => ({ ...l, pag: p })));
  if (!todas.length) return { html: "", repetidas, removidas };
  // medidas do texto comum
  const alturas = todas.map(l => Math.round(l.h * 2) / 2).sort((a, b) => a - b);
  const corpo = alturas[Math.floor(alturas.length / 2)];
  const esquerdas = todas.filter(l => Math.abs(l.h - corpo) < 1).map(l => Math.round(l.x)).sort((a, b) => a - b);
  const margemEsq = esquerdas[Math.floor(esquerdas.length * 0.1)] || 40;
  const margemDir = Math.max(...todas.map(l => l.fim));
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const runsHtml = runs => runs.map(r => { let s = esc(r.s); if (r.i) s = `<em>${s}</em>`; if (r.b) s = `<strong>${s}</strong>`; return s; }).join("").replace(/<\/strong><strong>/g, "").replace(/<\/em><em>/g, "");
  // blocos
  const blocos = [];
  let atual = null;
  const RE_LISTA_NUM = /^(\d{1,2})[.)]\s+/, RE_BOLINHA = /^[•◦▪●\-–]\s+/;
  todas.forEach((l, k) => {
    const ant = todas[k - 1];
    const titulo = l.h > corpo * 1.12 || (l.negrito && l.texto.length < 90 && Math.abs((l.x + l.fim) / 2 - l.pag.larg / 2) < 30 && l.x > margemEsq + 40);
    const recuo = l.x - margemEsq;
    const tipoLista = RE_LISTA_NUM.test(l.texto) ? "ol" : RE_BOLINHA.test(l.texto) ? "ul" : null;
    const continua = atual && ant && ant.pag === l.pag && !titulo && !tipoLista && atual.tipo !== "h"
      && l.y - ant.y < ant.h * 1.9 && ant.fim > margemDir * 0.82 && Math.abs(l.x - atual.x) < 14;
    const continuaItem = atual && atual.tipo === "li" && ant && !titulo && !tipoLista && l.y - ant.y < ant.h * 1.9 && l.x > atual.xLista + 4 && ant.fim > margemDir * 0.75;
    if (continua || continuaItem) { atual.runs.push({ s: " ", b: false, i: false }, ...l.runs); return; }
    if (titulo) { atual = { tipo: "h", nivel: l.h > corpo * 1.3 ? 2 : 3, runs: l.runs, x: l.x }; blocos.push(atual); return; }
    if (tipoLista) {
      const runs = l.runs.slice(); runs[0] = { ...runs[0], s: runs[0].s.replace(tipoLista === "ol" ? RE_LISTA_NUM : RE_BOLINHA, "") };
      atual = { tipo: "li", lista: tipoLista, runs, x: l.x, xLista: l.x }; blocos.push(atual); return;
    }
    atual = { tipo: recuo > 18 ? "caixa" : "p", runs: l.runs, x: l.x }; blocos.push(atual);
  });
  let html = "", listaAberta = null;
  for (const b of blocos) {
    if (b.tipo !== "li" && listaAberta) { html += `</${listaAberta}>`; listaAberta = null; }
    const conteudo = runsHtml(b.runs).trim();
    if (!conteudo) continue;
    if (b.tipo === "h") html += `<h${b.nivel}>${conteudo.replace(/<\/?strong>/g, "")}</h${b.nivel}>`;
    else if (b.tipo === "li") { if (listaAberta !== b.lista) { if (listaAberta) html += `</${listaAberta}>`; html += `<${b.lista}>`; listaAberta = b.lista; } html += `<li>${conteudo}</li>`; }
    else if (b.tipo === "caixa") html += `<blockquote>${conteudo}</blockquote>`;
    else html += `<p>${conteudo}</p>`;
  }
  if (listaAberta) html += `</${listaAberta}>`;
  html = html.replace(/<\/blockquote><blockquote>/g, "<br>").replace(/<\/em>(\s*)<em>/g, "$1").replace(/<\/strong>(\s*)<strong>/g, "$1");
  return { html, repetidas, removidas };
}

  const vm = t.closest("[data-ver-mudanca]");
  if (vm) { painelMudanca(vm.dataset.verMudanca); return; }
  const aa = t.closest("[data-atualizar-ancora]");
  if (aa) { await ancorarNaVersaoAtual(aa.dataset.atualizarAncora); fecharPainel(); return; }
  const ir = t.closest("[data-ir]");
  if (ir) {
    const [id, art] = ir.dataset.ir.split("|");
    fecharPainel();
    if (leiAberta === id) irParaArtigo(art); else location.hash = `#/lei/${id}/${encodeURIComponent(art)}`;
    return;
  }
  const aba = t.closest("#abas button");
  if (aba) {
    raizNav = true;
    const alvo = "#/" + aba.dataset.rota;
    if (location.hash === alvo) rotear(); else location.hash = alvo;
  }
});

async function rotear() {
  if (window.salvarResumoPendente) { await window.salvarResumoPendente(); window.salvarResumoPendente = null; }   // nada se perde ao sair do editor
  if (!location.hash.startsWith("#/resumo/")) { window.onscroll = null; resumoAberto = null; alternarFocoResumo(false); }
  registrarNavegacao();
  const voltou = voltandoNav, y = pilhaNav[pilhaNav.length - 1]?.y || 0;
  const destino = location.hash.replace(/^#\/?/, "").split("/");
  if (caneta.ativa && !(destino[0] === "lei" && destino[1] === leiAberta)) alternarCaneta(false);
  if (destino[0] !== "lei") document.body.classList.remove("tela-cheia");
  await rotearTela();
  if (voltou && y && destino[0] !== "lei") requestAnimationFrame(() => window.scrollTo(0, y));   // volta à mesma altura da lista
}
async function rotearTela() {
  fecharPainel();
  if (cronometro) clearInterval(cronometro.intervalo);
  esconderBarra();
  mostrarAvisoOffline();
  const partes = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (partes[0] === "lei" && partes[1]) {
    if (leiAberta === partes[1] && partes[2] && document.getElementById("texto-lei")) { irParaArtigo(partes[2]); return; }
    window.scrollTo(0, 0);
    return telaLei(partes[1], partes[2]);
  }
  window.scrollTo(0, 0);
  leiAberta = null;
  $("#conteudo").classList.remove("modo-leitor");
  if (partes[0] === "alteracoes" && partes[1]) return telaAlteracoes(partes[1]);
  if (partes[0] === "pesquisar") return telaPesquisar();
  if (partes[0] === "questoes") return telaQuestoes(partes[1] === "pasta" ? partes[2] : null);
  if (partes[0] === "estatisticas") return telaEstatisticasGerais();
  if (partes[0] === "caderno" && partes[1]) return telaCaderno("caderno", partes[1], partes[2] === "questao" ? "questoes" : (partes[2] || "questoes"), partes[2] === "questao" ? partes[3] : null);
  if (partes[0] === "questoes-artigo" && partes[2]) return telaCaderno("artigo", partes[1] + "|" + partes[2], "questoes");
  if (partes[0] === "estudos") {
    if (partes[1] === "alterados" && partes[2]) { sessionStorage.setItem("filtro-mudou-" + partes[2], "1"); return telaEstudos("lei", partes[2], "anotacoes"); }
    return telaEstudos(partes[1] || "", partes[2] || "", partes[3] || "anotacoes");
  }
  if (partes[0] === "ajustes") return telaAjustes();
  if (partes[0] === "catalogo") return telaCatalogo();
  if (partes[0] === "resumos") return partes[1] === "materia" ? telaResumos("todas", partes[2] || "") : telaResumos(partes[1] || "todas");
  if (partes[0] === "resumo" && partes[1]) return partes[2] === "editar" ? telaResumoEditar(partes[1]) : telaResumoLer(partes[1]);
  if (partes[0] === "acervo" && partes[1] === "pasta") return telaAcervo(partes[2]);
  if (partes[0] === "acervo" && partes[1] === "favoritas") return telaAcervo("favoritas");
  return telaAcervo();
}
window.addEventListener("hashchange", rotear);

async function atualizarTudo() {
  await carregarStatus();
  mostrarAvisoOffline();
  await migrarAcervo();
  const ids = idsAcervo();                   // só as leis do seu acervo são baixadas
  const pendentes = ids.filter(id => estado.status[id].hash && (!estado.info[id] || estado.info[id].hash !== estado.status[id].hash));
  if (pendentes.length && !leiAberta && (!location.hash || location.hash === "#/acervo")) telaAcervo();
  for (const id of pendentes) await sincronizarLei(id);
  await carregarQuestoes();
  // as leis do acervo são carregadas na memória aos poucos, depois que a tela já apareceu
  setTimeout(async () => { for (const id of ids) { await leiDoCache(id); await new Promise(r => setTimeout(r, 30)); } }, 600);
}

async function iniciar() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  try { await abrirBD(); await carregarItens(); }
  catch { alert("Não foi possível abrir o armazenamento de anotações neste navegador. Grifos e anotações não serão salvos."); }
  await atualizarTudo();
  rotear();
}
let ultimaAtualizacao = Date.now();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && window.salvarResumoPendente) window.salvarResumoPendente(); });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || Date.now() - ultimaAtualizacao < 180000) return;
  ultimaAtualizacao = Date.now();
  const antes = JSON.stringify(estado.info);
  await atualizarTudo();
  if (JSON.stringify(estado.info) !== antes) rotear();
});
iniciar();
</script>
