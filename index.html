<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161C22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Legislação">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-180.png">
<title>Leitor de Legislação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topo" id="topo">
  <button class="icone-btn oculto" id="btn-voltar" aria-label="Voltar">‹ Voltar</button>
  <h1 id="titulo">Leis</h1>
  <button class="icone-btn oculto" id="btn-sumario">Sumário</button>
  <button class="icone-btn oculto" id="btn-ir">Ir para art.</button>
  <button class="icone-btn oculto" id="btn-buscar-lei" aria-label="Buscar nesta lei">Buscar</button>
  <button class="icone-btn oculto" id="btn-ouvir" title="Ouvir a lei em voz alta">🔊 Ouvir</button>
  <button class="icone-btn oculto" id="btn-caneta" aria-pressed="false">✏️ Caneta</button>
  <button class="icone-btn oculto" id="btn-tela-cheia" aria-pressed="false">⛶ Tela cheia</button>
  <button class="icone-btn oculto" id="btn-sync" title="Sincronização">☁️</button>
  <button class="icone-btn oculto" id="btn-aa" aria-label="Ajustes de leitura">Aa</button>
</header>

<div id="aviso-offline" class="aviso oculto"></div>
<main id="conteudo"></main>

<nav class="abas" id="abas" aria-label="Menu principal">
  <button data-rota="acervo" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.6-.9 3.4 15.2-3.6.8z"/></svg>
    Leis</button>
  <button data-rota="questoes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9l1.5 1.5L12 8M8 15l1.5 1.5L12 14M14 9.5h3M14 15.5h3"/></svg>
    Questões</button>
  <button data-rota="resumos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10M9 8h5M9 11h5"/></svg>
    Resumos</button>
  <button data-rota="pesquisar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
    Pesquisar</button>
  <button data-rota="estudos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9 11h6M9 15h4"/></svg>
    Meus estudos</button>
  <button data-rota="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    Configurações</button>
</nav>
<div id="camada-fixa">
<div id="barra-selecao" class="barra-selecao oculto" role="toolbar" aria-label="Trecho selecionado">
  <button class="cor-btn g-amarelo" data-cor="amarelo" aria-label="Grifar em amarelo"></button>
  <button class="cor-btn g-verde" data-cor="verde" aria-label="Grifar em verde"></button>
  <button class="cor-btn g-azul" data-cor="azul" aria-label="Grifar em azul"></button>
  <button class="cor-btn g-vermelho" data-cor="vermelho" aria-label="Grifar em vermelho"></button>
  <span class="sep"></span>
  <button class="icone-btn" data-acao-sel="anotar">Anotar</button>
  <button class="icone-btn" data-acao-sel="favoritar">Favoritar</button>
  <button class="icone-btn" data-acao-sel="copiar">Copiar</button>
</div>

<div id="barra-caneta" class="barra-selecao barra-caneta oculto" role="toolbar" aria-label="Caneta"></div>



<div id="painel" class="painel oculto" role="dialog" aria-modal="true"><div class="painel-caixa" id="painel-caixa"></div></div>
</div>
<input type="file" id="entrada-imagens" accept="image/*" multiple hidden>
<input type="file" id="entrada-backup" accept=".json,application/json" hidden>

<script src="js/base.js"></script>
<script src="js/telas.js"></script>
<script src="js/questoes.js"></script>
<script src="js/paineis.js"></script>
<script src="js/caneta.js"></script>
<script src="js/resumos.js"></script>
<script src="js/extras.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
