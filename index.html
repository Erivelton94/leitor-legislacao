<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161C22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Legislação">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-180.png">
<title>Leitor de Legislação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #F5F6F2;       /* papel-bíblia, levemente frio */
  --folha: #FFFFFF;
  --tinta: #1F2A36;       /* azul-tinta dos textos oficiais */
  --tinta-2: #55606B;
  --fio: #DADDD6;
  --oliva: #5E6B25;       /* o oliva do cabeçalho do Planalto */
  --oliva-claro: #EEF0E2;
  --ok: #2E7A4C;
  --pend: #A8740F;
  --alt: #B23A3A;
  --marca: #FFE58A;
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino", Georgia, serif;
  --sans: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte: 19px;
  --entrelinha: 1.7;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #161C22; --folha: #1D242B; --tinta: #E4E7E3; --tinta-2: #9AA3AB;
    --fio: #2E3740; --oliva: #B4C46B; --oliva-claro: #26301F;
    --ok: #6FC38F; --pend: #E0B04A; --alt: #EE8080; --marca: #6B5A12;
  }
}
:root[data-theme="dark"] {
  --papel: #161C22; --folha: #1D242B; --tinta: #E4E7E3; --tinta-2: #9AA3AB;
  --fio: #2E3740; --oliva: #B4C46B; --oliva-claro: #26301F;
  --ok: #6FC38F; --pend: #E0B04A; --alt: #EE8080; --marca: #6B5A12;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
body {
  margin: 0; min-height: 100%; background: var(--papel); color: var(--tinta);
  font-family: var(--sans); font-size: 16px; -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--oliva); outline-offset: 2px; }
.oculto { display: none !important; }

/* ---------- barra superior ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  background: var(--papel); border-bottom: 1px solid var(--fio); min-height: 56px;
}
.topo h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone-btn {
  border: 0; background: transparent; min-width: 44px; height: 44px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
  color: var(--oliva); padding: 0 10px;
}
.icone-btn:active { background: var(--oliva-claro); }

.aviso {
  margin: 12px 16px 0; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.45;
  background: var(--folha); border: 1px solid var(--fio); color: var(--tinta-2);
}
.aviso.forte { border-color: var(--alt); color: var(--tinta); }
.aviso a, .aviso button.link { color: var(--oliva); font-weight: 600; }
button.link { border: 0; background: none; padding: 0; text-decoration: underline; }

main { max-width: 860px; margin: 0 auto; padding-bottom: 96px; }
main.modo-leitor { max-width: none; padding-bottom: 0; }
.modo-leitor > .aviso { max-width: 1148px; margin-left: auto; margin-right: auto; }

/* ---------- acervo: lombadas de vade-mécum ---------- */
.acervo { list-style: none; margin: 16px; padding: 0; display: grid; gap: 10px; }
.lei-item {
  display: grid; grid-template-columns: 10px 1fr auto; align-items: stretch;
  background: var(--folha); border: 1px solid var(--fio); border-radius: 12px; overflow: hidden;
}
.lei-item .aba { background: var(--cor-aba, var(--oliva)); }
.lei-item button.abrir {
  text-align: left; border: 0; background: transparent; padding: 14px 16px; display: grid; gap: 4px;
}
.lei-nome { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.2; }
.lei-num { font-size: 14px; color: var(--tinta-2); }
.lei-verif { font-size: 13px; color: var(--tinta-2); }
.selo { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.selo::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.selo.ok { color: var(--ok); } .selo.pend { color: var(--pend); }
.selo.alt { color: var(--alt); } .selo.erro { color: var(--alt); }
.selo.erro::before { border-radius: 2px; transform: rotate(45deg); }

/* ---------- leitor ---------- */
.leitor-wrap { display: grid; grid-template-columns: 1fr; }
@media (min-width: 1000px) {
  .leitor-wrap { grid-template-columns: 280px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .sumario-lateral { display: block !important; }
  #btn-sumario { display: none; }
}
.sumario-lateral {
  display: none; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px);
  height: calc(100vh - 57px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--fio); padding: 12px 8px 40px;
}
.sumario a {
  display: block; padding: 7px 10px; border-radius: 8px; color: var(--tinta); text-decoration: none;
  font-size: 14px; line-height: 1.35;
}
.sumario a.n2 { padding-left: 22px; color: var(--tinta-2); }
.sumario a.n3 { padding-left: 34px; color: var(--tinta-2); font-size: 13px; }
.sumario a:active { background: var(--oliva-claro); }

.texto-lei {
  font-family: var(--serif); font-size: var(--fonte); line-height: var(--entrelinha);
  padding: 8px 22px 120px; max-width: 38em; margin: 0 auto; width: 100%;
  font-variant-numeric: oldstyle-nums;
}
.texto-lei p { margin: 0 0 0.5em; hyphens: auto; -webkit-hyphens: auto; }
.estrutura {
  font-family: var(--sans); text-align: center; font-weight: 700; font-size: 0.78em;
  letter-spacing: 0.02em; color: var(--oliva); margin: 2.4em 0 0.3em !important; line-height: 1.4;
}
.estrutura + .estrutura { margin-top: 0 !important; }
.rubrica { font-family: var(--sans); font-weight: 600; font-size: 0.8em; color: var(--tinta-2); margin: 1.4em 0 0.2em !important; }
.artigo { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 72px); padding: 0.35em 0 0.35em; position: relative; }
.artigo.revogado { color: var(--tinta-2); }
.rotulo { font-weight: 700; color: var(--oliva); border: 0; background: none; padding: 0; font-family: inherit; font-size: inherit; }
.par { padding-left: 1.2em; }
.inc { padding-left: 2em; }
.ali { padding-left: 3em; }
.pena { padding-left: 1.2em; font-style: italic; }
.nota { font-family: var(--sans); font-size: 0.68em; color: var(--tinta-2); white-space: normal; }
.artigo.alterado { box-shadow: -8px 0 0 -4px var(--alt); }
.artigo.alvo { background: var(--oliva-claro); border-radius: 6px; }
mark { background: var(--marca); color: inherit; border-radius: 2px; }
.rodape-fonte { font-family: var(--sans); font-size: 13px; color: var(--tinta-2); border-top: 1px solid var(--fio); padding-top: 14px; margin-top: 3em; line-height: 1.5; }
.rodape-fonte a { color: var(--oliva); }

/* ---------- painéis (busca, sumário, ajustes, menu do artigo) ---------- */
.painel {
  position: fixed; inset: 0; z-index: 50; background: rgba(15, 20, 25, 0.35);
  display: flex; align-items: flex-end; justify-content: center;
}
.painel-caixa {
  background: var(--papel); width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 700px) {
  .painel { align-items: center; }
  .painel-caixa { border-radius: 16px; }
}
.painel-caixa h2 { font-size: 17px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
.campo {
  width: 100%; border: 1px solid var(--fio); background: var(--folha); border-radius: 10px;
  padding: 12px 14px; font-size: 17px;
}
.resultados { list-style: none; padding: 0; margin: 12px 0 0; }
.resultados li button {
  width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--fio); background: none;
  padding: 12px 4px; display: grid; gap: 4px;
}
.res-titulo { font-weight: 600; font-size: 15px; }
.res-trecho { font-family: var(--serif); font-size: 15px; color: var(--tinta-2); line-height: 1.45; }
.contagem { font-size: 13px; color: var(--tinta-2); margin-top: 10px; }
.linha-ajuste { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--fio); }
.segmentado { display: inline-flex; border: 1px solid var(--fio); border-radius: 10px; overflow: hidden; }
.segmentado button { border: 0; background: var(--folha); padding: 9px 14px; font-size: 14px; }
.segmentado button[aria-pressed="true"] { background: var(--oliva); color: var(--papel); }
.acoes { display: grid; gap: 8px; }
.acoes button, .botao {
  border: 1px solid var(--fio); background: var(--folha); border-radius: 10px; padding: 13px 14px;
  text-align: left; font-size: 16px;
}
.botao.primario { background: var(--oliva); color: var(--papel); border-color: var(--oliva); text-align: center; font-weight: 600; }

/* ---------- abas inferiores ---------- */
.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; gap: 4px;
  background: var(--papel); border-top: 1px solid var(--fio);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.abas button {
  border: 0; background: none; min-width: 96px; padding: 8px 10px; border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--tinta-2); display: grid; justify-items: center; gap: 2px;
}
.abas button[aria-current="page"] { color: var(--oliva); background: var(--oliva-claro); }
.abas svg { width: 22px; height: 22px; }
.secao { margin: 20px 16px; }
.secao h2 { font-size: 15px; color: var(--tinta-2); font-weight: 600; margin: 0 0 8px; }
.cartao { background: var(--folha); border: 1px solid var(--fio); border-radius: 12px; padding: 4px 16px; }
.cartao p { font-size: 14px; color: var(--tinta-2); line-height: 1.5; }
.vazio { margin: 40px 24px; text-align: center; color: var(--tinta-2); line-height: 1.5; }
@media (prefers-reduced-motion: no-preference) {
  .painel-caixa { animation: sobe 0.18s ease-out; }
  @keyframes sobe { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}

/* ---------- entrega 2: grifos, anotações, favoritos, pastas, alterações ---------- */
:root { --g-amarelo: #FFE58A; --g-verde: #BDEBC4; --g-azul: #BFDDF7; --g-vermelho: #F7C1C1;
        --add: #D9F2DF; --add-t: #1D6B3A; --del: #F9DADA; --del-t: #9B2C2C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --g-amarelo: #6B5A12; --g-verde: #1F5A33; --g-azul: #1E4466; --g-vermelho: #6A2626;
    --add: #1C3F29; --add-t: #9BE0B0; --del: #4A2222; --del-t: #F2A8A8; }
}
:root[data-theme="dark"] { --g-amarelo: #6B5A12; --g-verde: #1F5A33; --g-azul: #1E4466; --g-vermelho: #6A2626;
  --add: #1C3F29; --add-t: #9BE0B0; --del: #4A2222; --del-t: #F2A8A8; }

mark.grifo { color: inherit; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; cursor: pointer; }
.g-amarelo { background: var(--g-amarelo); } .g-verde { background: var(--g-verde); }
.g-azul { background: var(--g-azul); } .g-vermelho { background: var(--g-vermelho); }
mark.grifo.com-nota { border-bottom: 2px dotted var(--tinta-2); }

.artigo.favorito .rotulo::after { content: " ★"; color: var(--pend); }
.ind-notas {
  border: 1px solid var(--fio); background: var(--folha); color: var(--oliva); border-radius: 999px;
  font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 3px 10px; margin: 2px 0 6px 1.2em; cursor: pointer;
}
.ind-notas::after { content: "Anotações: " attr(data-n); }
.ind-notas.atencao { border-color: var(--alt); color: var(--alt); }
.ind-notas.atencao::after { content: "Anotações: " attr(data-n) " · artigo alterado"; }

.preambulo { text-align: center; margin: 1.2em 0 1.6em; }
.preambulo .epigrafe { font-family: var(--sans); font-weight: 700; color: var(--oliva); font-size: 0.85em; }
.preambulo .ementa { font-style: italic; text-align: left; margin-left: 40% !important; font-size: 0.92em; color: var(--tinta-2); }
.preambulo .promulgacao { text-align: left; }
@media (max-width: 700px) { .preambulo .ementa { margin-left: 15% !important; } }

/* barra que aparece ao selecionar um trecho */
.barra-selecao {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 40;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 14px;
  background: var(--folha); border: 1px solid var(--fio); box-shadow: 0 6px 24px rgba(0,0,0,0.18);
  -webkit-user-select: none; user-select: none; max-width: calc(100vw - 24px); overflow-x: auto;
}
.cor-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--fio); flex: none; }
.cor-btn[aria-pressed="true"] { border-color: var(--tinta); }
.barra-selecao .icone-btn { flex: none; }
.sep { width: 1px; align-self: stretch; background: var(--fio); margin: 0 4px; }

/* chips de pastas */
.pastas { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 2px; -webkit-overflow-scrolling: touch; }
.chip {
  flex: none; border: 1px solid var(--fio); background: var(--folha); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--tinta-2);
}
.chip[aria-pressed="true"] { background: var(--oliva); border-color: var(--oliva); color: var(--papel); }
.lei-item .mais { border: 0; background: transparent; color: var(--tinta-2); font-size: 22px; padding: 0 16px; }
.lei-fav { color: var(--pend); }

/* cartões de anotação/favorito */
.lista-cartoes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.cartao-nota { background: var(--folha); border: 1px solid var(--fio); border-radius: 12px; padding: 12px 14px; }
.cartao-nota .origem { font-size: 13px; font-weight: 600; color: var(--oliva); border: 0; background: none; padding: 0; text-align: left; }
.cartao-nota .citacao { font-family: var(--serif); font-size: 15px; line-height: 1.5; border-left: 3px solid var(--fio); padding-left: 10px; margin: 8px 0; color: var(--tinta-2); }
.cartao-nota .corpo { white-space: pre-wrap; line-height: 1.5; font-size: 15px; margin: 6px 0; }
.cartao-nota .meta { font-size: 12px; color: var(--tinta-2); }
.cartao-nota .alerta { font-size: 13px; color: var(--alt); margin: 6px 0; line-height: 1.45; }
.cartao-nota .linha-acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cartao-nota .linha-acoes button { border: 1px solid var(--fio); background: var(--papel); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.miniaturas { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.miniaturas figure { margin: 0; position: relative; }
.miniaturas img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--fio); cursor: zoom-in; }
.miniaturas .tirar { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--alt); color: #fff; font-weight: 700; }
textarea.campo { min-height: 140px; resize: vertical; font-family: var(--sans); line-height: 1.5; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
select.campo { width: auto; font-size: 15px; padding: 9px 12px; }
.imagem-cheia { max-width: 100%; border-radius: 10px; }

/* comparação antes/depois */
.diff { font-family: var(--serif); font-size: 17px; line-height: 1.65; white-space: pre-wrap; background: var(--folha); border: 1px solid var(--fio); border-radius: 10px; padding: 12px 14px; }
.diff ins { background: var(--add); color: var(--add-t); text-decoration: none; border-radius: 2px; }
.diff del { background: var(--del); color: var(--del-t); border-radius: 2px; }
.diff .corte { color: var(--tinta-2); font-family: var(--sans); font-size: 13px; }
.legenda-diff { font-size: 13px; color: var(--tinta-2); display: flex; gap: 14px; margin: 6px 0 12px; }
.legenda-diff del, .legenda-diff ins { padding: 0 4px; }
.legenda-diff del { background: var(--del); color: var(--del-t); } .legenda-diff ins { background: var(--add); color: var(--add-t); text-decoration: none; }
.bloco-alteracao { margin: 18px 0 26px; }
.bloco-alteracao h3 { font-size: 16px; margin: 0 0 4px; }
.bloco-alteracao .meta { font-size: 13px; color: var(--tinta-2); margin-bottom: 8px; line-height: 1.45; }
.bloco-alteracao a, .cartao a { color: var(--oliva); font-weight: 600; }
/* ---------- questões ---------- */
.barra-prog { display: block; height: 6px; border-radius: 3px; background: var(--fio); overflow: hidden; margin: 4px 0 2px; max-width: 320px; }
.barra-prog span { display: block; height: 100%; background: var(--oliva); }
.q-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--fio); }
.cronometro { font-size: 14px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.q-meta { font-size: 14px; color: var(--tinta-2); margin: 10px 0 2px; line-height: 1.5; }
.q-meta a { color: var(--oliva); font-weight: 600; }
.q-prova { font-size: 14px; font-weight: 600; margin: 2px 0 10px; }
.q-enunciado { font-family: var(--serif); font-size: calc(var(--fonte) + 1px); line-height: 1.6; }
.q-enunciado p { margin: 0 0 0.7em; }
.alternativas { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
.alternativas li { display: flex; gap: 6px; align-items: stretch; }
.alt { flex: 1; display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--fio); background: var(--folha);
  border-radius: 12px; padding: 12px 14px; font-family: var(--serif); font-size: var(--fonte); line-height: 1.5; }
.alt .letra { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--tinta-2); display: inline-flex;
  align-items: center; justify-content: center; font-family: var(--sans); font-size: 14px; font-weight: 700; margin-top: 1px; }
.alt.marcada { border-color: var(--oliva); box-shadow: inset 0 0 0 1px var(--oliva); }
.alt.marcada .letra { background: var(--oliva); color: var(--papel); border-color: var(--oliva); }
.alt.certa { background: var(--add); border-color: var(--ok); }
.alt.certa .letra { background: var(--ok); border-color: var(--ok); color: #fff; }
.alt.errada { background: var(--del); border-color: var(--alt); }
.alt.errada .letra { background: var(--alt); border-color: var(--alt); color: #fff; }
.alt.riscada .alt-texto { text-decoration: line-through; opacity: 0.45; }
.alternativas.ce { grid-template-columns: 1fr 1fr; max-width: 420px; }
.riscar { flex: none; width: 44px; border: 1px solid var(--fio); background: var(--folha); border-radius: 12px; color: var(--tinta-2); }
.acoes-q { margin: 6px 0; } .acoes-q .botao { min-width: 160px; }
.botao:disabled { opacity: 0.45; }
.res-q { font-size: 18px; font-weight: 600; margin: 12px 0; } .res-q.ok { color: var(--ok); } .res-q.erro { color: var(--alt); }
.res-q .link { font-size: 16px; color: var(--oliva); }
.txt-ok { color: var(--ok); } .txt-erro { color: var(--alt); }

<script>
"use strict";
/* =====================================================================
   Leitor Inteligente de Legislação — Entrega 2
   Leis: vêm do robô (dados/). Só baixa uma lei quando o hash dela mudou.
   Seus dados (grifos, anotações, imagens, favoritos, pastas): IndexedDB,
   separados das leis. Atualizar ou remover uma lei nunca apaga nada seu.
   ===================================================================== */

const CACHE_DADOS = "legislacao-dados-v1";
const HORAS_PENDENTE = 36;
const CORES_ABA = ["#5E6B25", "#2F5D7C", "#8A3B2E", "#6B4E8A", "#2E7466", "#8A6A1F"];
const CORES = { amarelo: "Amarelo", verde: "Verde", azul: "Azul", vermelho: "Vermelho" };
const REPO_ACTIONS = "https://github.com/Erivelton94/leitor-legislacao/actions/workflows/verificar.yml";
const LIMITE_IMAGENS_MB = 200;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const estado = {
  status: {}, leis: {}, historicos: {}, offline: false, statusEm: null,
  info: lerLS("info-leis", {}),
  alteracoes: lerLS("alteracoes-nao-vistas", {}),
  sincronizando: new Set(),
  itens: new Map(),        // grifos, anotações, favoritos, pastas (id -> item)
};

function lerLS(chave, padrao) { try { return JSON.parse(localStorage.getItem(chave)) ?? padrao; } catch { return padrao; } }
function gravarLS(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {} }
function esc(t) { return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function semAcento(t) { return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function dataHora(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function dataCurta(iso) { if (!iso) return "—"; const [a, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${a}`; }
function agoraISO() { return new Date().toISOString(); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function urlLei(id) { return `dados/leis/${id}.json`; }
function nomeLei(id) { return estado.status[id]?.nome || id; }
function rotuloArt(art) { return "Art. " + String(art).replace(/#\d+$/, ""); }

/* ---------------- ajustes de leitura ---------------- */
const ajustes = Object.assign({ fonte: 19, entrelinha: 1.7, tema: "auto" }, lerLS("ajustes", {}));
function aplicarAjustes() {
  const r = document.documentElement;
  r.style.setProperty("--fonte", ajustes.fonte + "px");
  r.style.setProperty("--entrelinha", ajustes.entrelinha);
  if (ajustes.tema === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", ajustes.tema);
  gravarLS("ajustes", ajustes);
}
aplicarAjustes();

/* =====================================================================
   SEUS DADOS (IndexedDB)
   Cada item tem id, tipo e atualizadoEm. Apagar = marcar "apagado"
   (assim a importação de um backup antigo não ressuscita o que você apagou).
   ===================================================================== */
let BD = null;
function abrirBD() {
  return new Promise((ok, erro) => {
    const r = indexedDB.open("meus-estudos", 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("itens")) db.createObjectStore("itens", { keyPath: "id" });
      if (!db.objectStoreNames.contains("imagens")) db.createObjectStore("imagens", { keyPath: "id" });
    };
    r.onsuccess = () => ok(BD = r.result);
    r.onerror = () => erro(r.error);
  });
}
function bd(store, modo, fn) {
  return new Promise((ok, erro) => {
    const t = BD.transaction(store, modo);
    const req = fn(t.objectStore(store));
    let res;
    if (req) req.onsuccess = () => { res = req.result; };
    t.oncomplete = () => ok(res);
    t.onerror = () => erro(t.error);
    t.onabort = () => erro(t.error);
  });
}
const bdTodos = store => bd(store, "readonly", s => s.getAll());
const bdLer = (store, id) => bd(store, "readonly", s => s.get(id));
const bdGravar = (store, obj) => bd(store, "readwrite", s => s.put(obj));
const bdApagar = (store, id) => bd(store, "readwrite", s => s.delete(id));

async function carregarItens() {
  for (const it of await bdTodos("itens")) estado.itens.set(it.id, it);
}
async function salvarItem(item) {
  item.atualizadoEm = agoraISO();
  if (!item.criadoEm) item.criadoEm = item.atualizadoEm;
  await bdGravar("itens", item);
  estado.itens.set(item.id, item);
  gravarLS("ultima-mudanca", item.atualizadoEm);
  return item;
}
async function apagarItem(id) {
  const velho = estado.itens.get(id);
  if (velho && velho.tipo === "anotacao") for (const img of velho.imagens || []) await bdApagar("imagens", img);
  await salvarItem({ id, tipo: velho ? velho.tipo : "?", apagado: true });
}
function itens(tipo, filtro = () => true) {
  return [...estado.itens.values()].filter(i => !i.apagado && i.tipo === tipo && filtro(i));
}

/* ---------------- favoritos ---------------- */
const idFavLei = lei => `fav|lei|${lei}`;
const idFavArt = (lei, art) => `fav|art|${lei}|${art}`;
function ehFavorito(id) { const i = estado.itens.get(id); return !!(i && !i.apagado); }
async function alternarFavorito(id, dados) {
  if (ehFavorito(id)) await apagarItem(id);
  else await salvarItem({ id, tipo: "favorito", ...dados });
}

/* =====================================================================
   LEIS: status, download incremental e histórico
   ===================================================================== */
async function buscarComTempo(url, ms = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { cache: "no-cache", signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r;
  } finally { clearTimeout(t); }
}

async function carregarStatus() {
  const cache = await caches.open(CACHE_DADOS);
  try {
    const r = await buscarComTempo("dados/status.json");
    await cache.put("dados/status.json", r.clone());
    estado.status = await r.json();
    estado.offline = false;
    estado.statusEm = agoraISO();
    gravarLS("status-em", estado.statusEm);
  } catch {
    estado.offline = true;
    const antigo = await cache.match("dados/status.json");
    estado.status = antigo ? await antigo.json() : {};
    estado.statusEm = lerLS("status-em", null);
  }
}

async function leiDoCache(id) {
  if (estado.leis[id]) return estado.leis[id];
  const cache = await caches.open(CACHE_DADOS);
  const r = await cache.match(urlLei(id));
  if (!r) return null;
  estado.leis[id] = await r.json();
  return estado.leis[id];
}

async function sincronizarLei(id) {
  const st = estado.status[id];
  if (!st || !st.hash) return;
  const local = estado.info[id];
  const cache = await caches.open(CACHE_DADOS);
  const temCopia = await cache.match(urlLei(id));
  if (temCopia && local && local.hash === st.hash) return;
  if (estado.offline) return;
  estado.sincronizando.add(id);
  try {
    const r = await buscarComTempo(urlLei(id), 30000);
    const copia = r.clone();
    const lei = await r.json();
    await cache.put(urlLei(id), copia);
    estado.leis[id] = lei;
    if (local && local.versao && lei.versao !== local.versao) await registrarAlteracoes(id, local.versao, lei.versao);
    estado.info[id] = { hash: lei.hash, versao: lei.versao, baixadoEm: agoraISO() };
    gravarLS("info-leis", estado.info);
  } catch { /* segue marcada como pendente */ }
  finally { estado.sincronizando.delete(id); }
}

async function carregarHistorico(id) {
  const url = `dados/historico/${id}.json`;
  const cache = await caches.open(CACHE_DADOS);
  if (!estado.offline) {
    try {
      const r = await buscarComTempo(url);
      await cache.put(url, r.clone());
      return (estado.historicos[id] = await r.json());
    } catch { /* sem histórico ainda (nenhuma alteração) ou sem conexão */ }
  }
  const c = await cache.match(url);
  return (estado.historicos[id] = c ? await c.json() : []);
}

async function registrarAlteracoes(id, desde, ate) {
  const hist = await carregarHistorico(id);
  let artigos = [];
  for (const reg of hist) {
    if (reg.versao_nova > desde) {
      reg.alterados.forEach(a => artigos.push({ artigo: a.artigo, tipo: "alterado" }));
      reg.incluidos.forEach(a => artigos.push({ artigo: a.artigo, tipo: "incluído" }));
      reg.removidos.forEach(a => artigos.push({ artigo: a.artigo, tipo: "removido" }));
    }
  }
  const vistos = new Set();
  artigos = artigos.filter(a => !vistos.has(a.artigo) && vistos.add(a.artigo));
  estado.alteracoes[id] = { desde, ate, artigos };
  gravarLS("alteracoes-nao-vistas", estado.alteracoes);
}

function situacao(id) {
  const st = estado.status[id];
  if (!st) return { cls: "pend", txt: "Verificação pendente", sub: "Ainda não há verificação registrada." };
  const local = estado.info[id];
  const okEm = st.ultima_verificacao_ok;
  const subOk = "Última verificação confirmada: " + dataHora(okEm);
  if (estado.alteracoes[id]) return { cls: "alt", txt: "Alteração detectada", sub: "A lei mudou desde a sua última leitura. " + subOk };
  if (!local || local.hash !== st.hash) {
    if (estado.sincronizando.has(id)) return { cls: "pend", txt: "Baixando versão atual", sub: subOk };
    return local
      ? { cls: "alt", txt: "Alteração detectada", sub: "Há uma versão nova que ainda não foi baixada. Conecte-se à internet." }
      : { cls: "pend", txt: "Ainda não baixada", sub: "Conecte-se à internet para baixar esta lei." };
  }
  if (st.status === "ERRO_VERIFICACAO") return { cls: "erro", txt: "Não foi possível confirmar a atualização", sub: subOk };
  if (!okEm) return { cls: "pend", txt: "Verificação pendente", sub: "A fonte oficial ainda não foi consultada com sucesso." };
  if ((Date.now() - new Date(okEm)) / 36e5 > HORAS_PENDENTE) return { cls: "pend", txt: "Verificação pendente", sub: subOk };
  return { cls: "ok", txt: "Atualizada", sub: subOk };
}

/* =====================================================================
   INTERPRETAÇÃO DO TEXTO
   ===================================================================== */
const RE_NOTA = /\((?:Reda[çc][ãa]o|Inclu[íi]d|Revogad|Vide|Vig[êe]ncia|Renumerad|Acrescid|Regulamento|Produ[çc][ãa]o de efeito|Declarad|Suspens|Promulga|Vetad|Convertid|Express[ãa]o|Texto)[^()]*(?:\([^()]*\)[^()]*)*\)/g;
const RE_ESTRUTURA = /^(PARTE|LIVRO|T[ÍI]TULO|CAP[ÍI]TULO|SE[ÇC][ÃA]O|Se[çc][ãa]o|SUBSE[ÇC][ÃA]O|Subse[çc][ãa]o|DISPOSI[ÇC][ÕO]ES)\b/;

function tipoLinha(l, i) {
  if (i === 0) return "caput";
  if (/^(§|Par[áa]grafo [úu]nico)/i.test(l)) return "par";
  if (/^[IVXLC]+\s*[-–—]/.test(l)) return "inc";
  if (/^[a-z]\)\s/.test(l)) return "ali";
  if (/^Pena\s*[-–—]/.test(l)) return "pena";
  if (/^\(.*\)$/.test(l)) return "notalinha";
  if (RE_ESTRUTURA.test(l)) return "estrutura";
  const letras = l.replace(/[^A-Za-zÀ-ú]/g, "");
  if (letras.length > 3 && letras === letras.toUpperCase()) return "estrutura";
  if (l.length <= 140 && !/[.;:,]$/.test(l) && /^[A-ZÀ-Ú]/.test(l) && !/^Art/.test(l)) return "rubrica";
  return "texto";
}

function chaveOrdem(id) {
  const [base, dup] = id.split("#");
  const [num, ...letras] = base.split("-");
  return { num: parseInt(num, 10), letras, dup: parseInt(dup || "1", 10) };
}
function compararArtigos(a, b) {
  const x = chaveOrdem(a), y = chaveOrdem(b);
  if (x.num !== y.num) return x.num - y.num;
  for (let i = 0; i < Math.max(x.letras.length, y.letras.length); i++) {
    if (x.letras[i] === undefined) return -1;
    if (y.letras[i] === undefined) return 1;
    if (x.letras[i] !== y.letras[i]) return x.letras[i] < y.letras[i] ? -1 : 1;
  }
  return x.dup - y.dup;
}

const ehTitulo = l => l && (l.tipo === "rubrica" || l.tipo === "estrutura");
/* Títulos no fim de um bloco pertencem ao artigo seguinte (inclui uma nota logo abaixo de um título). */
function tirarTitulosDoFim(ls, minimo) {
  const mover = [];
  while (ls.length > minimo) {
    const u = ls[ls.length - 1], pen = ls[ls.length - 2];
    if (ehTitulo(u) || (u.tipo === "notalinha" && ehTitulo(pen) && ls.length - 1 > minimo)) mover.unshift(ls.pop());
    else break;
  }
  return mover;
}

function prepararLei(lei) {
  if (lei._prep) return lei._prep;
  const ids = Object.keys(lei.artigos).sort(compararArtigos);
  const arts = ids.map(id => ({
    id, linhas: lei.artigos[id].texto.split("\n").map((t, i) => ({ t, tipo: tipoLinha(t, i) })), antes: [],
  }));
  // preâmbulo: epígrafe, ementa, fórmula de promulgação e os primeiros títulos
  let pre = [];
  if (lei.preambulo && lei.preambulo.length) {
    let promulgou = false;
    pre = lei.preambulo.map((t, i) => {
      let tipo;
      if (i === 0) tipo = "epigrafe";
      else if (/^\(.*\)$/.test(t)) tipo = "notalinha";
      else if (/^(O|A) PRESIDENT|^O CONGRESSO|^AS MESAS/i.test(t)) { tipo = "promulgacao"; promulgou = true; }
      else if (!promulgou) tipo = "ementa";
      else tipo = tipoLinha(t, 1);
      return { t, tipo };
    });
    if (arts.length) arts[0].antes = tirarTitulosDoFim(pre, 0);
  }
  for (let k = 0; k < arts.length - 1; k++) arts[k + 1].antes = tirarTitulosDoFim(arts[k].linhas, 1);
  for (const a of arts) {
    a.antes.forEach((l, j) => {
      const prox = a.antes[j + 1];
      if (l.tipo === "estrutura" && RE_ESTRUTURA.test(l.t) && prox && prox.tipo === "rubrica") prox.tipo = "estrutura";
    });
  }
  const sumario = [];
  for (const a of arts) {
    for (let j = 0; j < a.antes.length; j++) {
      const l = a.antes[j];
      if (l.tipo !== "estrutura" || !RE_ESTRUTURA.test(l.t)) continue;
      let rotulo = l.t;
      const prox = a.antes[j + 1];
      if (prox && prox.tipo === "estrutura" && !RE_ESTRUTURA.test(prox.t)) rotulo += " — " + prox.t;
      const nivel = /^(PARTE|LIVRO|T[ÍI]TULO)/i.test(l.t) ? 1 : /^CAP/i.test(l.t) ? 2 : 3;
      sumario.push({ rotulo, nivel, alvo: a.id });
    }
  }
  lei._prep = { arts, sumario, pre };
  return lei._prep;
}

function linhaHTML(texto) { return esc(texto).replace(RE_NOTA, m => `<span class="nota">${m}</span>`); }

function artigoHTML(a, alterados, leiId) {
  let h = "";
  for (const l of a.antes) {
    h += l.tipo === "notalinha" ? `<p class="rubrica"><span class="nota">${esc(l.t)}</span></p>`
      : `<p class="${l.tipo === "estrutura" ? "estrutura" : "rubrica"}">${esc(l.t)}</p>`;
  }
  const caput = a.linhas[0].t;
  const semNotas = caput.replace(RE_NOTA, "").replace(/^Art\.?\s*[\dºo°\-A-Z]+\.?\s*[-–]?\s*/, "").trim();
  const revogado = !semNotas && /Revogad/i.test(caput);
  const m = caput.match(/^(Art\.?\s*[\dºo°]+(?:-[A-Z]{1,2})*\.?)(.*)$/);
  const rot = m ? m[1] : "";
  const resto = m ? m[2] : caput;
  const cls = ["artigo"];
  if (revogado) cls.push("revogado");
  if (alterados && alterados.has(a.id)) cls.push("alterado");
  if (ehFavorito(idFavArt(leiId, a.id))) cls.push("favorito");
  h += `<div class="${cls.join(" ")}" id="art-${esc(a.id)}" data-art="${esc(a.id)}">`;
  h += `<p><button class="rotulo" data-menu="${esc(a.id)}">${esc(rot)}</button>${linhaHTML(resto)}</p>`;
  for (let i = 1; i < a.linhas.length; i++) {
    const l = a.linhas[i];
    const c = { par: "par", inc: "inc", ali: "ali", pena: "pena", rubrica: "rubrica", estrutura: "rubrica" }[l.tipo] || "";
    h += l.tipo === "notalinha" ? `<p><span class="nota">${esc(l.t)}</span></p>` : `<p${c ? ` class="${c}"` : ""}>${linhaHTML(l.t)}</p>`;
  }
  return h + "</div>";
}

function preambuloHTML(pre) {
  if (!pre.length) return "";
  return `<div class="preambulo">${pre.map(l => {
    if (l.tipo === "notalinha") return `<p><span class="nota">${esc(l.t)}</span></p>`;
    const c = { epigrafe: "epigrafe", ementa: "ementa", promulgacao: "promulgacao", estrutura: "estrutura", rubrica: "rubrica" }[l.tipo] || "";
    return `<p class="${c}">${linhaHTML(l.t)}</p>`;
  }).join("")}</div>`;
}

/* =====================================================================
   ÂNCORAS DOS GRIFOS E ANOTAÇÕES
   Cada marcação guarda: artigo, posição, o trecho exato, 40 letras antes e
   depois, o hash do artigo e uma cópia do texto do artigo naquela versão.
   ===================================================================== */
function textoDoArtigo(div) { return div.textContent; }
function posicaoNoArtigo(div, no, off) {
  const r = document.createRange();
  r.setStart(div, 0);
  r.setEnd(no, off);
  return r.toString().length;
}
function pintar(div, ini, fim, cls, dados) {
  const alvos = [];
  const w = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
  let n, pos = 0;
  while ((n = w.nextNode())) {
    const a = pos, b = pos + n.data.length;
    pos = b;
    if (b <= ini || a >= fim) continue;
    alvos.push([n, Math.max(ini, a) - a, Math.min(fim, b) - a]);
  }
  for (const [no, s, e] of alvos) {
    let alvo = no;
    if (e < alvo.data.length) alvo.splitText(e);
    if (s > 0) alvo = alvo.splitText(s);
    const m = document.createElement("mark");
    m.className = cls;
    Object.assign(m.dataset, dados);
    alvo.parentNode.insertBefore(m, alvo);
    m.appendChild(alvo);
  }
}
function comumFim(a, b) { let k = 0; while (k < a.length && k < b.length && a[a.length - 1 - k] === b[b.length - 1 - k]) k++; return k; }
function comumInicio(a, b) { let k = 0; while (k < a.length && k < b.length && a[k] === b[k]) k++; return k; }

/* Onde está o trecho marcado no texto atual? exato | reposicionado | perdido */
function localizar(item, textoAtual, hashAtual) {
  if (!item.texto) return { estado: "artigo" };
  if (textoAtual.slice(item.ini, item.fim) === item.texto &&
      textoAtual.slice(Math.max(0, item.ini - item.prefixo.length), item.ini) === item.prefixo) {
    return { ini: item.ini, fim: item.fim, estado: item.hashArt === hashAtual ? "exato" : "reposicionado" };
  }
  let melhor = null, idx = textoAtual.indexOf(item.texto);
  while (idx >= 0) {
    const pre = textoAtual.slice(Math.max(0, idx - item.prefixo.length), idx);
    const suf = textoAtual.slice(idx + item.texto.length, idx + item.texto.length + item.sufixo.length);
    const nota = comumFim(pre, item.prefixo) + comumInicio(suf, item.sufixo);
    if (!melhor || nota > melhor.nota) melhor = { ini: idx, fim: idx + item.texto.length, nota };
    idx = textoAtual.indexOf(item.texto, idx + 1);
  }
  if (!melhor) return { estado: "perdido" };
  return { ini: melhor.ini, fim: melhor.fim, estado: item.hashArt === hashAtual ? "exato" : "reposicionado" };
}

function artigoMudou(item) {
  const lei = estado.leis[item.lei];
  const art = lei && item.art && lei.artigos[item.art];
  if (!item.art) return false;
  if (!art) return true;                  // artigo não existe mais nesta versão
  return item.hashArt !== art.hash;
}

function marcacoesDoArtigo(leiId, art) {
  return [...estado.itens.values()].filter(i => !i.apagado && i.lei === leiId && i.art === art &&
    (i.tipo === "grifo" || i.tipo === "anotacao" || (i.tipo === "favorito" && i.alvo === "trecho")));
}

function aplicarMarcacoes(leiId, div) {
  const art = div.dataset.art;
  const lei = estado.leis[leiId];
  const hashAtual = lei.artigos[art]?.hash;
  const texto = textoDoArtigo(div);
  const lista = marcacoesDoArtigo(leiId, art);
  const grifos = lista.filter(i => i.tipo === "grifo");
  const notas = lista.filter(i => i.tipo === "anotacao");
  for (const g of grifos) {
    const loc = localizar(g, texto, hashAtual);
    if (loc.estado === "perdido" || loc.estado === "artigo") continue;
    const comNota = notas.some(n => n.grifoId === g.id);
    pintar(div, loc.ini, loc.fim, `grifo g-${g.cor}${comNota ? " com-nota" : ""}`, { grifo: g.id });
  }
  div.querySelector(".ind-notas")?.remove();
  div.querySelector(".ind-questoes")?.remove();
  const qs = questoesDoArtigo(leiId, art);
  if (qs.length) {
    const v = qs[0].vinculo;
    const b = document.createElement("button");
    b.className = "ind-questoes";
    b.dataset.questoesArt = art;
    b.dataset.rotulo = `Questões: ${qs.length}` + (v.de !== v.ate ? ` (assunto dos ${rotuloVinculo(v)})` : "");
    b.setAttribute("aria-label", `${qs.length} questões sobre este artigo`);
    div.appendChild(b);
  }
  if (notas.length) {
    const b = document.createElement("button");
    b.className = "ind-notas" + (notas.some(artigoMudou) ? " atencao" : "");
    b.dataset.n = notas.length;
    b.dataset.notas = art;
    b.setAttribute("aria-label", `${notas.length} anotação(ões) neste artigo`);
    div.appendChild(b);
  }
}
function repintarArtigo(leiId, art) {
  const div = document.getElementById("art-" + art);
  if (!div) return;
  const prep = prepararLei(estado.leis[leiId]);
  const a = prep.arts.find(x => x.id === art);
  const alt = estado.alteracoes[leiId];
  const tmp = document.createElement("div");
  tmp.innerHTML = artigoHTML({ ...a, antes: [] }, alt ? new Set(alt.artigos.map(x => x.artigo)) : null, leiId);
  const novo = tmp.firstElementChild;
  div.replaceWith(novo);
  aplicarMarcacoes(leiId, novo);
}

/* =====================================================================
   COMPARAÇÃO PALAVRA A PALAVRA
   ===================================================================== */
function diffPalavras(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length;
  if (n * m > 4e6) return [{ t: "del", s: a }, { t: "ins", s: b }];
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  const add = (t, s) => { if (out.length && out[out.length - 1].t === t) out[out.length - 1].s += s; else out.push({ t, s }); };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { add("eq", A[i]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) add("del", A[i++]);
    else add("ins", B[j++]);
  }
  while (i < n) add("del", A[i++]);
  while (j < m) add("ins", B[j++]);
  return out;
}
function diffHTML(antes, depois) {
  const partes = diffPalavras(antes, depois);
  return partes.map((p, k) => {
    if (p.t === "del") return `<del>${esc(p.s)}</del>`;
    if (p.t === "ins") return `<ins>${esc(p.s)}</ins>`;
    // trechos iguais longos: mostra só o entorno da mudança
    const s = p.s, CTX = 120;
    if (s.length <= CTX * 2 + 40) return esc(s);
    const inicio = k === 0 ? "" : s.slice(0, CTX);
    const fim = k === partes.length - 1 ? "" : s.slice(-CTX);
    return esc(inicio) + `<span class="corte"> [ … trecho sem alteração … ] </span>` + esc(fim);
  }).join("");
}
function normaAlteradora(antes, depois) {
  const notas = t => new Set((t.match(RE_NOTA) || []).map(x => x.trim()));
  const a = notas(antes);
  const novas = [...notas(depois)].filter(x => !a.has(x));
  return novas.length ? novas.join(" ") : "";
}

function telaAcervo() {

  if (sel !== "todas" && sel !== "favoritas" && !pastas.some(p => p.id === sel)) sel = "todas";

    ${pastas.map(p => `<button class="chip" data-pasta="${esc(p.id)}" aria-pressed="${sel === p.id}">${esc(p.nome)} (${p.leis.filter(l => todos.includes(l)).length})</button>`).join("")}
    <button class="chip" id="nova-pasta">+ Nova pasta</button>
    ${pastas.length ? '<button class="chip" id="editar-pastas">Editar pastas</button>' : ""}
  </div>`;
  const semBackup = temDadosSemBackup();
  if (semBackup) h += `<div class="aviso">Seus grifos e anotações ficam só neste aparelho. ${semBackup} <a href="#/ajustes">Fazer backup</a></div>`;
  for (const id of todos.filter(i => estado.alteracoes[i])) {

    const comNotas = alt.artigos.filter(a => marcacoesDoArtigo(id, a.artigo).length).length;
    h += `<div class="aviso forte">⚠️ <strong>${esc(nomeLei(id))}</strong> mudou desde a sua última leitura` +
      (lista ? `: ${esc(lista)}${alt.artigos.length > 8 ? "…" : ""}.` : ".") +
      (comNotas ? ` Você tem marcações em ${comNotas} desses artigos.` : "") +
      ` <a href="#/alteracoes/${esc(id)}">Ver alterações</a></div>`;
  }
  if (!ids.length) {
    h += `<p class="vazio">${sel === "favoritas" ? "Nenhuma lei favoritada. Use o botão ⋯ de uma lei para favoritá-la."
      : "Esta pasta está vazia. Use o botão ⋯ de uma lei para colocá-la aqui."}</p>`;
  } else {
    h += `<ul class="acervo">`;
    for (const id of ids) {
      const i = todos.indexOf(id);
      const st = estado.status[id];
      const s = situacao(id);
      h += `<li class="lei-item" style="--cor-aba:${CORES_ABA[i % CORES_ABA.length]}">
        <span class="aba"></span>
        <button class="abrir" data-abrir="${esc(id)}">

          <span class="lei-num">${esc(st.numero || "")}${st.n_artigos ? " · " + st.n_artigos + " artigos" : ""}</span>
          <span class="selo ${s.cls}">${esc(s.txt)}</span>
          <span class="lei-verif">${esc(s.sub)}</span>
        </button>
        <button class="mais" data-menu-lei="${esc(id)}" aria-label="Opções de ${esc(st.nome)}">⋯</button>
      </li>`;
    }
    h += "</ul>";
  }
  $("#conteudo").innerHTML = h;
}

function temDadosSemBackup() {
  const ultimaMudanca = lerLS("ultima-mudanca", null);
  if (!ultimaMudanca) return "";
  const ativos = [...estado.itens.values()].filter(i => !i.apagado && i.tipo !== "pasta").length;
  if (!ativos) return "";
  const ultimo = lerLS("ultimo-backup", null);
  if (!ultimo) return "Você ainda não fez nenhum backup.";
  const dias = (Date.now() - new Date(ultimo)) / 864e5;
  if (ultimaMudanca > ultimo && dias > 7) return `Último backup: ${dataCurta(ultimo)}.`;
  return "";
}

/* ---------- Leitor ---------- */
let leiAberta = null;
async function telaLei(id, alvo) {
  const st = estado.status[id];
  definirTopo({ titulo: st ? st.nome : "Lei", leitor: true, voltar: "#/acervo" });
  let lei = await leiDoCache(id);

  if (!lei) {
    $("#conteudo").innerHTML = `<p class="vazio">Esta lei ainda não foi baixada para o aparelho. Conecte-se à internet e abra de novo.</p>`;
    return;
  }
  leiAberta = id;
  $("#conteudo").classList.add("modo-leitor");
  const prep = prepararLei(lei);
  const alt = estado.alteracoes[id];
  const alterados = alt ? new Set(alt.artigos.map(a => a.artigo)) : null;
  const s = situacao(id);

  let topoAviso = `<div class="aviso"><span class="selo ${s.cls}">${esc(s.txt)}</span><br>${esc(s.sub)} · Versão de ${dataCurta(lei.versao)}</div>`;
  if (alt) {
    const links = alt.artigos.map(a => `<a href="#/lei/${esc(id)}/${encodeURIComponent(a.artigo)}">${esc(rotuloArt(a.artigo))}</a> (${a.tipo})`).join(", ");
    topoAviso += `<div class="aviso forte">⚠️ Esta lei mudou desde a sua última leitura${links ? ": " + links : ""}. ` +
      `Os artigos alterados estão marcados com uma faixa vermelha à esquerda. ` +
      `<a href="#/alteracoes/${esc(id)}">Ver antes e depois</a> · <button class="link" id="btn-entendi">Marcar como lido</button></div>`;
  }
  const mudadas = itens("anotacao", i => i.lei === id && artigoMudou(i)).length + itens("grifo", i => i.lei === id && artigoMudou(i)).length;
  if (mudadas) topoAviso += `<div class="aviso forte">⚠️ ${mudadas} grifo(s) ou anotação(ões) sua(s) estão em artigos que mudaram depois que você os marcou. Eles foram preservados. <a href="#/estudos/alterados/${esc(id)}">Revisar</a></div>`;

  const sumarioHTML = prep.sumario.map(x => `<a class="n${x.nivel}" href="#/lei/${esc(id)}/${encodeURIComponent(x.alvo)}">${esc(x.rotulo)}</a>`).join("");
  let texto = preambuloHTML(prep.pre);
  for (const a of prep.arts) texto += artigoHTML(a, alterados, id);

  $("#conteudo").innerHTML = `${topoAviso}
    <div class="leitor-wrap">
      <nav class="sumario sumario-lateral" aria-label="Sumário">${sumarioHTML || '<p class="contagem">Esta lei não tem divisões.</p>'}</nav>
      <article class="texto-lei" id="texto-lei" lang="pt-BR">
        ${texto}
        <div class="rodape-fonte">Fonte: texto compilado do Planalto —
          <a href="${esc(lei.url)}" target="_blank" rel="noopener">abrir a página oficial</a>.<br>
          O texto compilado não substitui o publicado no Diário Oficial da União.</div>
      </article>
    </div>`;
  $$("#texto-lei .artigo").forEach(div => aplicarMarcacoes(id, div));
  const btn = $("#btn-entendi");
  if (btn) btn.onclick = () => { delete estado.alteracoes[id]; gravarLS("alteracoes-nao-vistas", estado.alteracoes); telaLei(id); };

  const destino = alvo || lerLS("posicao", {})[id];
  if (destino) irParaArtigo(destino, !!alvo);
  observarPosicao(id);
}

function irParaArtigo(artId, destacar = true) {
  const el = document.getElementById("art-" + artId);
  if (!el) return false;
  el.scrollIntoView({ block: "start" });
  if (destacar) { el.classList.add("alvo"); setTimeout(() => el.classList.remove("alvo"), 2200); }
  return true;
}

let observador = null;
function observarPosicao(id) {
  if (observador) observador.disconnect();
  let tempo = null;
  observador = new IntersectionObserver(entradas => {
    const visivel = entradas.find(e => e.isIntersecting);
    if (!visivel) return;
    clearTimeout(tempo);
    tempo = setTimeout(() => { const pos = lerLS("posicao", {}); pos[id] = visivel.target.dataset.art; gravarLS("posicao", pos); }, 400);
  }, { rootMargin: "-80px 0px -70% 0px" });
  $$(".artigo").forEach(el => observador.observe(el));
}

    const blocos = [
      ...reg.alterados.map(a => ({ art: a.artigo, tipo: "alterado", antes: a.antes, depois: a.depois })),
      ...reg.incluidos.map(a => ({ art: a.artigo, tipo: "incluído", antes: "", depois: a.texto })),
      ...reg.removidos.map(a => ({ art: a.artigo, tipo: "removido", antes: a.texto, depois: "" })),

        `${marc.length ? `<strong style="color:var(--alt)">⚠️ Você possui ${marc.length} marcação(ões) neste artigo.</strong> ` : ""}` +
        `${b.tipo !== "removido" ? `<a href="#/lei/${esc(id)}/${encodeURIComponent(b.art)}">Abrir na lei</a>` : ""}</div>
        <div class="diff">${b.tipo === "alterado" ? diffHTML(b.antes, b.depois) : b.tipo === "incluído" ? `<ins>${esc(b.depois)}</ins>` : `<del>${esc(b.antes)}</del>`}</div></div>`;
    }
  }
  $("#conteudo").innerHTML = h + "</div>";
}

/* ---------- Pesquisar ---------- */
function buscarEm(lei, id, termo, limite = 200) {
  const alvo = semAcento(termo.trim());
  if (alvo.length < 2) return [];
  const res = [];
  for (const a of prepararLei(lei).arts) {
    const texto = a.linhas.map(l => l.t).join(" ");
    const pos = semAcento(texto).indexOf(alvo);
    if (pos < 0) continue;
    const ini = Math.max(0, pos - 60);
    const trecho = texto.slice(ini, pos + alvo.length + 90);
    const i2 = pos - ini;
    res.push({ id, art: a.id, trecho: (ini > 0 ? "…" : "") + esc(trecho.slice(0, i2)) + "<mark>" + esc(trecho.slice(i2, i2 + alvo.length)) + "</mark>" + esc(trecho.slice(i2 + alvo.length)) + "…" });
    if (res.length >= limite) break;
  }
  return res;
}
function listaResultados(res, mostrarLei) {
  if (!res.length) return "";
  return `<ul class="resultados">${res.map(r => `<li><button data-ir="${esc(r.id)}|${esc(r.art)}">
    <span class="res-titulo">${mostrarLei ? esc(nomeLei(r.id)) + " — " : ""}${esc(rotuloArt(r.art))}</span>
    <span class="res-trecho">${r.trecho}</span></button></li>`).join("")}</ul>`;
}
function destacar(texto, termo) {
  const alvo = semAcento(termo.trim());
  const pos = semAcento(texto).indexOf(alvo);
  if (pos < 0 || !alvo) return esc(texto);
  return esc(texto.slice(0, pos)) + "<mark>" + esc(texto.slice(pos, pos + alvo.length)) + "</mark>" + esc(texto.slice(pos + alvo.length));
}

function alertaMudanca(i) {
  if (!artigoMudou(i)) return "";

  return `<div class="alerta">⚠️ ${existe ? "O artigo foi alterado depois desta marcação" : "Este artigo não existe mais na versão atual"} ` +

/* =====================================================================
   QUESTÕES
   Cadernos vêm de dados/questoes/ (só baixa quando o hash muda).
   Cada resposta sua é um item "resposta" (entra no backup).
   ===================================================================== */
estado.cadernos = {};
estado.q = new Map();

async function carregarQuestoes() {
  const cache = await caches.open(CACHE_DADOS);
  let indice = null;
  if (!estado.offline) {
    try {
      const r = await buscarComTempo("dados/questoes/indice.json");
      await cache.put("dados/questoes/indice.json", r.clone());
      indice = await r.json();
    } catch { /* ainda não há cadernos publicados */ }
  }
  if (!indice) { const c = await cache.match("dados/questoes/indice.json"); indice = c ? await c.json() : { cadernos: [] }; }
  estado.indiceQ = indice;
  const info = lerLS("info-cadernos", {});
  for (const cad of indice.cadernos) {
    const url = "dados/questoes/" + cad.arquivo;
    const guardado = await cache.match(url);
    if (guardado && info[cad.id] === cad.hash) { estado.cadernos[cad.id] = await guardado.json(); continue; }
    if (!estado.offline) {
      try {
        const r = await buscarComTempo(url, 30000);
        await cache.put(url, r.clone());
        estado.cadernos[cad.id] = await r.json();
        info[cad.id] = cad.hash;
        continue;
      } catch {}
    }
    if (guardado) estado.cadernos[cad.id] = await guardado.json();
  }
  gravarLS("info-cadernos", info);
  estado.q = new Map();
  for (const c of Object.values(estado.cadernos)) for (const q of c.questoes) { q.caderno = c.id; estado.q.set(q.id, q); }
}

/* ---------- respostas e situação ---------- */
function mapaRespostas() {
  const m = new Map();   // qid -> [respostas em ordem]
  for (const r of itens("resposta")) { if (!m.has(r.q)) m.set(r.q, []); m.get(r.q).push(r); }
  for (const l of m.values()) l.sort((a, b) => a.em.localeCompare(b.em));
  return m;
}
function situacaoQ(mapa, qid) {
  const l = mapa.get(qid);
  if (!l || !l.length) return "nao";
  return l[l.length - 1].correta ? "certa" : "errada";
}
const idFavQ = qid => `fav|q|${qid}`;
const idNotaQ = qid => `nq|${qid}`;
function provaQ(q) { return [q.banca, q.ano, [q.cargo, q.orgao, q.area].filter(Boolean).join(" · ")].join(" — "); }
function rotuloVinculo(v) { return v.de === v.ate ? `art. ${v.de}` : `arts. ${v.de} a ${v.ate}`; }
function questoesDoArtigo(leiId, art) {
  return [...estado.q.values()].filter(q => q.vinculo && q.vinculo.lei === leiId &&
    compararArtigos(q.vinculo.de, art) <= 0 && compararArtigos(art, q.vinculo.ate) <= 0);
}

/* ---------- sessões: um caderno ou as questões de um artigo ---------- */
function montarSessao(tipo, chave) {
  if (tipo === "caderno") {
    const c = estado.cadernos[chave];
    if (!c) return null;
    return { chave: "c:" + chave, titulo: c.titulo, materia: c.materia, base: [...c.questoes].sort((a, b) => a.ordem - b.ordem),
             assuntos: c.assuntos, voltar: "#/questoes", rota: `#/caderno/${chave}` };
  }
  const [lei, art] = chave.split("|");
  const base = questoesDoArtigo(lei, art);
  const assuntos = [...new Set(base.map(q => q.assunto))];
  return { chave: "a:" + chave, titulo: `Questões — ${rotuloArt(art)} (${nomeLei(lei)})`, materia: "", base, assuntos,
           voltar: `#/lei/${lei}/${encodeURIComponent(art)}`, rota: `#/questoes-artigo/${lei}/${encodeURIComponent(art)}` };
}
function filtrosDe(s) { return Object.assign({ assunto: "", situacao: "", banca: "" }, lerLS("filtros-q", {})[s.chave] || {}); }
function gravarFiltros(s, f) { const t = lerLS("filtros-q", {}); t[s.chave] = f; gravarLS("filtros-q", t); }
function listaFiltrada(s, mapa) {
  const f = filtrosDe(s);
  return s.base.filter(q => (!f.assunto || q.assunto === f.assunto) && (!f.banca || q.banca === f.banca) &&
    (!f.situacao || (f.situacao === "favoritas" ? ehFavorito(idFavQ(q.id)) : situacaoQ(mapa, q.id) === f.situacao)));
}

      <select class="campo" id="f-situacao">
        ${[["", "Todas"], ["nao", "Não resolvidas"], ["errada", "Que errei"], ["certa", "Que acertei"], ["favoritas", "★ Favoritas"]].map(([v, r]) =>
          `<option value="${v}" ${f.situacao === v ? "selected" : ""}>${r}</option>`).join("")}</select>
      ${bancas.length > 1 ? `<select class="campo" id="f-banca"><option value="">Todas as bancas</option>${bancas.map(b => `<option ${f.banca === b ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>` : ""}
    </div>
    <div id="area-caderno"></div></div>`;
  const aplicar = () => {
    gravarFiltros(sessao, { assunto: $("#f-assunto").value, situacao: $("#f-situacao").value, banca: $("#f-banca")?.value || "" });
    telaCaderno(tipo, chave, aba);
  };
  $("#f-assunto").onchange = aplicar; $("#f-situacao").onchange = aplicar;
  if ($("#f-banca")) $("#f-banca").onchange = aplicar;
  $$("[data-aba-cad]").forEach(b => b.onclick = () => telaCaderno(tipo, chave, b.dataset.abaCad));
  sessao.tipo = tipo; sessao.chaveOrig = chave; sessao.lista = lista;
  if (aba === "indice") return abaIndice(mapa);
  if (aba === "gabarito") return abaGabarito(mapa);
  if (aba === "estatisticas") return abaEstatisticas(lista, mapa, true);

}

function abaQuestao(mapa, qAlvo) {
  const l = sessao.lista;

/* cronômetro da sessão de estudo (pausável) */
function iniciarCronometro() {
  if (!cronometro || cronometro.sessao !== sessao.chave) cronometro = { sessao: sessao.chave, acumulado: 0, desde: Date.now(), pausado: false };
  const pintar = () => {
    const el = $("#crono-t");
    if (!el) return;
    const s = Math.floor((cronometro.acumulado + (cronometro.pausado ? 0 : Date.now() - cronometro.desde)) / 1000);
    const hh = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
    el.textContent = (hh ? String(hh).padStart(2, "0") + ":" : "") + String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
    $("#crono-p").textContent = cronometro.pausado ? "continuar" : "pausar";
  };
  clearInterval(cronometro.intervalo);
  cronometro.intervalo = setInterval(pintar, 1000);
  pintar();
  $("#crono-p").onclick = () => {
    if (cronometro.pausado) { cronometro.desde = Date.now(); cronometro.pausado = false; }
    else { cronometro.acumulado += Date.now() - cronometro.desde; cronometro.pausado = true; }
    pintar();
  };
}

/* ---------- estatísticas ---------- */
function estatisticas(lista, mapa) {
  const ids = new Set(lista.map(q => q.id));
  let resolvidas = 0, certas = 0, erradas = 0, tentativas = 0, tempo = 0;
  const porAssunto = {}, porBanca = {}, porDia = {}, erros = [];
  for (const q of lista) {
    const rs = mapa.get(q.id) || [];
    const pa = porAssunto[q.assunto] = porAssunto[q.assunto] || { total: 0, resolvidas: 0, certas: 0, erradas: 0 };
    const pb = porBanca[q.banca] = porBanca[q.banca] || { total: 0, resolvidas: 0, certas: 0, erradas: 0 };
    pa.total++; pb.total++;
    if (!rs.length) continue;
    const ult = rs[rs.length - 1];
    resolvidas++; pa.resolvidas++; pb.resolvidas++;
    if (ult.correta) { certas++; pa.certas++; pb.certas++; } else { erradas++; pa.erradas++; pb.erradas++; }
    const nErros = rs.filter(r => !r.correta).length;
    if (nErros) erros.push({ q, nErros, tentativas: rs.length });
    for (const r of rs) {
      if (!ids.has(r.q)) continue;
      tentativas++; tempo += r.tempo || 0;
      const d = new Date(r.em).toLocaleDateString("sv-SE");   // dia no fuso do aparelho
      const pd = porDia[d] = porDia[d] || { certas: 0, erradas: 0 };
      if (r.correta) pd.certas++; else pd.erradas++;
    }
  }
  erros.sort((a, b) => b.nErros - a.nErros || b.tentativas - a.tentativas);
  return { total: lista.length, resolvidas, certas, erradas, tentativas, tempo, porAssunto, porBanca, porDia, erros,
           pct: resolvidas ? Math.round(100 * certas / resolvidas) : 0 };
}
function tabelaDesempenho(obj, ordem) {
  const chaves = ordem ? ordem.filter(k => obj[k]) : Object.keys(obj).sort();
  return `<div class="tabela-desemp">${chaves.map(k => {
    const v = obj[k];
    const pct = v.resolvidas ? Math.round(100 * v.certas / v.resolvidas) : null;
    return `<div class="linha-desemp"><span class="nome-desemp">${esc(k)}</span>
      <span class="barra-desemp" aria-hidden="true"><span class="b-ok" style="width:${v.total ? 100 * v.certas / v.total : 0}%"></span><span class="b-erro" style="width:${v.total ? 100 * v.erradas / v.total : 0}%"></span></span>
      <span class="num-desemp">${v.resolvidas}/${v.total} · ${pct === null ? "—" : pct + "%"}</span></div>`;
  }).join("")}</div>`;
}
function graficoDias(porDia) {
  const dias = [];
  for (let k = 29; k >= 0; k--) { const d = new Date(Date.now() - k * 864e5); dias.push(d.toLocaleDateString("sv-SE")); }
  const max = Math.max(1, ...dias.map(d => (porDia[d]?.certas || 0) + (porDia[d]?.erradas || 0)));
  const L = 600, A = 140, w = L / 30;
  let barras = "";
  dias.forEach((d, k) => {
    const c = porDia[d]?.certas || 0, e = porDia[d]?.erradas || 0;
    const hc = A * c / max, he = A * e / max;
    barras += `<rect x="${k * w + 2}" y="${A - hc}" width="${w - 4}" height="${hc}" fill="var(--ok)"><title>${dataCurta(d)}: ${c} acertos</title></rect>`;
    barras += `<rect x="${k * w + 2}" y="${A - hc - he}" width="${w - 4}" height="${he}" fill="var(--alt)"><title>${dataCurta(d)}: ${e} erros</title></rect>`;
  });
  return `<svg class="grafico-dias" viewBox="0 0 ${L} ${A + 18}" role="img" aria-label="Questões resolvidas por dia nos últimos 30 dias">
    <line x1="0" y1="${A}" x2="${L}" y2="${A}" stroke="var(--fio)"/>${barras}
    <text x="0" y="${A + 14}" font-size="11" fill="var(--tinta-2)">${dataCurta(dias[0])}</text>
    <text x="${L}" y="${A + 14}" font-size="11" fill="var(--tinta-2)" text-anchor="end">hoje</text></svg>`;
}
function formatarTempo(s) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h} h ${m} min` : `${m} min`; }

function abaEstatisticas(lista, mapa, noCaderno) {
  const e = estatisticas(lista, mapa);
  const alvo = noCaderno ? $("#area-caderno") : $("#conteudo");
  if (!e.total) { alvo.innerHTML = `<p class="vazio">Nenhuma questão com esses filtros.</p>`; return; }
  const ordemAssuntos = noCaderno ? sessao.assuntos : [...new Set([...estado.q.values()].map(q => q.assunto))];
  alvo.innerHTML = `${noCaderno ? "" : '<div class="secao">'}

      <div><strong class="txt-erro">${e.erradas}</strong><span>erros</span></div>
      <div><strong>${e.resolvidas ? e.pct + "%" : "—"}</strong><span>de acerto</span></div>
      <div><strong>${formatarTempo(e.tempo)}</strong><span>resolvendo (${e.tentativas} tentativas)</span></div>
    </div>
    <p class="contagem">Acertos e erros consideram a sua última resposta em cada questão.</p>

    <h3 class="grupo-assunto">Por banca</h3>${tabelaDesempenho(e.porBanca)}
    <h3 class="grupo-assunto">Evolução nos últimos 30 dias</h3>${graficoDias(e.porDia)}
    <p class="legenda-diff"><span style="color:var(--ok)">■ acertos</span><span style="color:var(--alt)">■ erros</span></p>
    <h3 class="grupo-assunto">Questões que você mais erra</h3>
    ${e.erros.length ? `<ul class="resultados">${e.erros.slice(0, 10).map(x => `<li><button data-href="#/caderno/${esc(x.q.caderno)}/questao/${esc(x.q.id)}">
      <span class="res-titulo">${x.nErros} erro(s) em ${x.tentativas} tentativa(s) — ${esc(x.q.assunto)}</span>
      <span class="res-trecho">${esc(x.q.enunciado.join(" ").slice(0, 140))}…</span></button></li>`).join("")}</ul>
      ${noCaderno ? '<div class="acoes" style="margin-top:12px"><button id="refazer-erradas" class="botao primario">Refazer só as que errei</button></div>' : ""}`
      : '<p class="contagem">Nenhum erro registrado até agora.</p>'}
    ${noCaderno ? "" : "</div>"}`;
  const btn = $("#refazer-erradas");
  if (btn) btn.onclick = () => {
    const f = filtrosDe(sessao); f.situacao = "errada"; gravarFiltros(sessao, f);
    telaCaderno(sessao.tipo, sessao.chaveOrig, "questoes");

}

/* ---------- Configurações ---------- */
async function tamanhoCache(filtro) {
  const cache = await caches.open(CACHE_DADOS);
  let bytes = 0, qtd = 0;
  for (const req of await cache.keys()) {
    if (!filtro(req.url)) continue;
    const r = await cache.match(req);
    bytes += (await r.clone().blob()).size; qtd++;
  }
  return { bytes, qtd };
}
const mb = b => (b / 1048576).toFixed(1).replace(".", ",") + " MB";

async function telaAjustes() {
  definirTopo({ titulo: "Configurações" });
  marcarAba("ajustes");
  const leis = await tamanhoCache(u => u.includes("/dados/leis/"));

  const bytesImg = imgs.reduce((s, i) => s + (i.blob?.size || 0), 0);

    <div class="linha-ajuste"><span>Espaçamento</span>${seg("entrelinha", [[1.5, "Justo"], [1.7, "Normal"], [1.95, "Amplo"]], ajustes.entrelinha)}</div>

  $("#fonte-menos", alvo).onclick = () => { ajustes.fonte = Math.max(14, ajustes.fonte - 1); aplicarAjustes(); montarAjustesLeitura(alvo); };
  $("#fonte-mais", alvo).onclick = () => { ajustes.fonte = Math.min(30, ajustes.fonte + 1); aplicarAjustes(); montarAjustesLeitura(alvo); };

/* ---------- seleção de trecho → barra de grifo ---------- */
let selecaoAtual = null;
function esconderBarra() { $("#barra-selecao").classList.add("oculto"); }
function lerSelecao() {
  const sel = window.getSelection();
  if (!leiAberta || !sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  const noIni = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
  const noFim = r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement;
  const div = noIni?.closest(".artigo");
  if (!div || div !== noFim?.closest(".artigo")) return { erro: "Selecione um trecho dentro de um único artigo." };
  let ini = posicaoNoArtigo(div, r.startContainer, r.startOffset);
  let fim = posicaoNoArtigo(div, r.endContainer, r.endOffset);
  const texto = textoDoArtigo(div);
  while (ini < fim && /\s/.test(texto[ini])) ini++;
  while (fim > ini && /\s/.test(texto[fim - 1])) fim--;
  if (fim <= ini) return null;
  return { lei: leiAberta, art: div.dataset.art, ini, fim, texto: texto.slice(ini, fim), textoArtigo: texto };
}
let tempoSel = null;
document.addEventListener("selectionchange", () => {
  clearTimeout(tempoSel);
  tempoSel = setTimeout(() => {
    const s = lerSelecao();
    if (s && !s.erro) { selecaoAtual = s; $("#barra-selecao").classList.remove("oculto"); }
    else if (!window.getSelection()?.toString()) setTimeout(() => { if (!window.getSelection()?.toString()) esconderBarra(); }, 300);
  }, 180);
});
function novaAncora(s) {
  const lei = estado.leis[s.lei];
  return {
    lei: s.lei, art: s.art, versao: lei.versao, hashArt: lei.artigos[s.art].hash, textoOriginal: lei.artigos[s.art].texto,
    ini: s.ini, fim: s.fim, texto: s.texto,
    prefixo: s.textoArtigo.slice(Math.max(0, s.ini - 40), s.ini), sufixo: s.textoArtigo.slice(s.fim, s.fim + 40),
  };
}
async function acaoSelecao(acao, cor) {
  const s = selecaoAtual;
  if (!s) return;
  window.getSelection()?.removeAllRanges();
  esconderBarra();
  if (acao === "grifar") {
    await salvarItem({ id: uid(), tipo: "grifo", cor, ...novaAncora(s) });
    repintarArtigo(s.lei, s.art);
  } else if (acao === "anotar") {
    editorAnotacao({ ...novaAncora(s), criarGrifo: true });   // o grifo só é criado se a anotação for salva
  } else if (acao === "favoritar") {
    await salvarItem({ id: uid(), tipo: "favorito", alvo: "trecho", ...novaAncora(s) });
    abrirPainel(`<h2>Trecho favoritado ${botaoFechar}</h2><p class="citacao" style="font-family:var(--serif)">“${esc(s.texto)}”</p><p class="contagem">Veja em Meus estudos → Favoritos.</p>`);
  } else if (acao === "copiar") {
    try { await navigator.clipboard.writeText(s.texto); } catch {}
  }
  selecaoAtual = null;
}
$("#barra-selecao").addEventListener("pointerdown", e => {
  const b = e.target.closest("button");
  if (!b) return;
  e.preventDefault();          // mantém a seleção enquanto o botão é tocado
  if (b.dataset.cor) acaoSelecao("grifar", b.dataset.cor);
